[project]
name = "fieldtwin-api"
version = "1.0.0"
description = "FieldTwin back-end API"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.5",
    "python-multipart==0.0.33",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "pytest==9.2.0",
    "referencing==0.37.0",
    "rfc3339-validator==0.1.4",
]
