openapi: 3.1.0
info:
  title: FieldTwin API
  version: 1.0.0
  summary: Interface contract between the FieldTwin front-end and back-end (PRD §6).
  description: |
    Encodes `prd.md` §6. Endpoints, schemas, and formats are our own design.
    Decisions made where the PRD was loose are listed in `docs/progress/02.md` ("Decisions").

    Conventions (PRD §6.1):
    - JSON unless stated. UTF-8. Timestamps ISO 8601 UTC.
    - IDs are short strings with a type prefix (`terr_`, `scan_`, `storm_`, `rot_`, `sim_`, ...).
    - Public coordinates are WGS84 `[lon, lat]`; bounding boxes are `[minLon, minLat, maxLon, maxLat]`.
      Internal grids use a local projected CRS (UTM) declared in `TerrainPackage.crs`.
    - Units: meters, millimeters, degrees, percent. Units are carried in field names (`_m`, `_mm`, `_ha`, `_pct`, ...).
    - Modeled values carry a `basis` of `measured | derived | modeled | assumed` (plus `relative` where §6.2 uses it).
    - Errors use one format everywhere (`Error`).
    - Asset files (PNG, JPEG, frame files) are immutable per ID and are served with
      `Cache-Control: public, max-age=31536000, immutable`.
    - Raster grids (heightmap, normal map, layers, risk, diff, frames) are row-major,
      row 0 = north edge, column 0 = west edge, and share the TerrainPackage grid
      (`grid.width` x `grid.height`) unless a simulation was downsampled (frames carry their own width/height).

    Simulation outputs are relative comparisons, never predictions.
servers:
  - url: /api/v1
    description: Same-origin base path
security: []  # No authentication: public demo API, no accounts.
tags:
  - name: system
    description: Liveness and mode.
  - name: sites
    description: Curated (pre-built) demo sites.
  - name: scans
    description: Land Scan jobs and progress events.
  - name: terrain
    description: TerrainPackage metadata, assets, layers, insights, provenance.
  - name: weather
    description: NASA POWER storms and long-term trends.
  - name: crops
    description: Crop library and rotations.
  - name: simulations
    description: Storm replays per rotation, evidence, differences.
  - name: notes
    description: Field notes (P2).

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and mode
      responses:
        '200':
          description: API is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }

  /sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: List curated sites
      responses:
        '200':
          description: Curated (pre-built) sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Site' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}:
    get:
      tags: [sites]
      operationId: getSite
      summary: One site
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /scans:
    post:
      tags: [scans]
      operationId: createScan
      summary: Start a Land Scan
      description: |
        Validates input, creates a job, and returns `scan_id` immediately. Re-submitting identical
        input returns the existing job (idempotent). With `OFFLINE=1`, only curated sites are accepted.
        Uploaded images supply appearance only; elevation always comes from open data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ScanCreateForm' }
            encoding:
              images:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '202':
          description: Scan job accepted (new or existing).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanCreated' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /scans/{scanId}:
    get:
      tags: [scans]
      operationId: getScan
      summary: Scan status and result
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Current scan status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /scans/{scanId}/events:
    get:
      tags: [scans]
      operationId: streamScanEvents
      summary: Server-sent progress events
      description: |
        Server-Sent Events stream (PRD §6.5). Every message uses event name `progress` and a JSON
        `data` payload matching `ProgressEvent`:

        ```
        event: progress
        data: {"scan_id":"scan_abc","stage":"building_mesh","pct":45,"message":"Building terrain mesh","ts":"2026-11-14T18:00:05Z"}
        ```

        Stages arrive in enum order. The stream ends after a `ready` event (which includes
        `terrain_id`) or a `failed` event (which includes `error`).
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: SSE stream; each `data:` line is a JSON `ProgressEvent`.
          content:
            text/event-stream:
              schema:
                type: string
                description: Raw SSE text. Each event's `data` decodes to `ProgressEvent`.
              x-sse-data-schema: { $ref: '#/components/schemas/ProgressEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}:
    get:
      tags: [terrain]
      operationId: getTerrain
      summary: TerrainPackage metadata
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: The terrain package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerrainPackage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/heightmap.png:
    get:
      tags: [terrain]
      operationId: getHeightmap
      summary: 16-bit heightmap
      description: |
        16-bit grayscale PNG, `grid.width` x `grid.height`.
        `elevation_m = elevation.min_m + (value / 65535) * (elevation.max_m - elevation.min_m)`.
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Heightmap PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/normal.png:
    get:
      tags: [terrain]
      operationId: getNormalMap
      summary: Normal map
      description: |
        8-bit RGB PNG, same size as the heightmap. Each channel encodes one component of the unit
        surface normal as `n = byte / 255 * 2 - 1`; R = +x (east), G = +y (north), B = +z (up).
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Normal map PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/texture.jpg:
    get:
      tags: [terrain]
      operationId: getTexture
      summary: Draped imagery
      description: JPEG (max 2048x2048) covering `texture.bounds_wgs84`.
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Texture JPEG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/jpeg:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/layers:
    get:
      tags: [terrain]
      operationId: getLayerCatalog
      summary: Layer catalog with legends
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Layer catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayerCatalog' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/layers/{name}.png:
    get:
      tags: [terrain]
      operationId: getLayer
      summary: A single analysis layer
      description: |
        8-bit grayscale PNG, same grid as the heightmap. Decode with the matching `LayerLegend`
        from `GET /terrain/{terrainId}/layers`. `cover_class` uses indexed values
        `0 other`, `1 vegetation`, `2 bare soil`, `3 water`, `255 nodata`.
      parameters:
        - $ref: '#/components/parameters/TerrainId'
        - name: name
          in: path
          required: true
          schema: { $ref: '#/components/schemas/LayerName' }
      responses:
        '200':
          description: Layer PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/insights:
    get:
      tags: [terrain]
      operationId: getTerrainInsights
      summary: Terrain and cover insights
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Insights, sorted by severity (highest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Insight' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/provenance:
    get:
      tags: [terrain]
      operationId: getProvenance
      summary: Data sources, assumptions, limits
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Provenance for this terrain package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /weather/summary:
    get:
      tags: [weather]
      operationId: getWeatherSummary
      summary: Trend summary 1981–present
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Weather trend summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherSummary' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /weather/storms:
    get:
      tags: [weather]
      operationId: listStorms
      summary: Ranked storm list
      parameters:
        - $ref: '#/components/parameters/TerrainIdQuery'
      responses:
        '200':
          description: Storms ranked from largest to smallest.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Storm' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /crops:
    get:
      tags: [crops]
      operationId: listCrops
      summary: Crop library
      responses:
        '200':
          description: Crop templates.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CropTemplate' }
        default: { $ref: '#/components/responses/Error' }

  /rotations/presets:
    get:
      tags: [crops]
      operationId: listRotationPresets
      summary: Existing plus two suggested rotations
      parameters:
        - $ref: '#/components/parameters/TerrainIdQuery'
      responses:
        '200':
          description: Exactly three rotations, existing first.
          content:
            application/json:
              schema:
                type: array
                minItems: 3
                maxItems: 3
                items: { $ref: '#/components/schemas/Rotation' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /rotations/validate:
    post:
      tags: [crops]
      operationId: validateRotation
      summary: Validate a user-edited rotation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResult' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /simulations:
    post:
      tags: [simulations]
      operationId: createSimulation
      summary: Run or fetch cached simulation
      description: |
        Cached by hash of (terrain, storm, rotation, options). Returns `200` with `cached: true`
        when a finished result exists, else `202` with a queued or running status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRequest' }
      responses:
        '200':
          description: Finished (cached) simulation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationStatus' }
        '202':
          description: Simulation queued or running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}:
    get:
      tags: [simulations]
      operationId: getSimulation
      summary: Status and result links
      parameters:
        - $ref: '#/components/parameters/SimId'
      responses:
        '200':
          description: Simulation status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/frames/{rotationId}.bin:
    get:
      tags: [simulations]
      operationId: getFrames
      summary: Water-depth frames
      description: |
        Binary, little-endian, one file per rotation per simulation (PRD §6.4). "FTW1" format:

        ```
        bytes 0-3    magic "FTW1"
        bytes 4-5    u16 width
        bytes 6-7    u16 height
        bytes 8-9    u16 frame_count
        byte  10     u8  dtype (1 = uint8)
        byte  11     u8  reserved
        bytes 12-15  f32 max_depth_mm (value 255 maps to this depth)
        bytes 16-... frame_count * width * height bytes, frames in time order
        ```

        `depth_mm = byte * max_depth_mm / 255`. Each frame is row-major, row 0 = north edge.
        Frame timing (`step_minutes`, `frame_times_min`) is in the matching `RotationResult`
        of the simulation status. Target size under about 5 MB; served with gzip
        (`Content-Encoding: gzip`) when the client accepts it.
      parameters:
        - $ref: '#/components/parameters/SimId'
        - $ref: '#/components/parameters/RotationIdPath'
      responses:
        '200':
          description: FTW1 frame file.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/risk/{rotationId}.png:
    get:
      tags: [simulations]
      operationId: getRisk
      summary: Relative erosion-risk grid
      description: |
        8-bit grayscale PNG. Byte value = relative erosion-risk index 0–100 (basis `relative`);
        `255` = masked / nodata (water, structures, outside field). Not an absolute soil-loss figure.
      parameters:
        - $ref: '#/components/parameters/SimId'
        - $ref: '#/components/parameters/RotationIdPath'
      responses:
        '200':
          description: Risk PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/evidence:
    get:
      tags: [simulations]
      operationId: getEvidence
      summary: Evidence cards and insights for the run
      parameters:
        - $ref: '#/components/parameters/SimId'
      responses:
        '200':
          description: Evidence cards (one per rotation) and run insights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceBundle' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/diff:
    get:
      tags: [simulations]
      operationId: getDiff
      summary: Difference grid between two rotations
      description: |
        Content-negotiated on `Accept`:
        - `image/png`: 8-bit grayscale difference grid of peak water depth, `b − a`.
          `diff_mm = (byte − 128) / 127 * max_abs_diff_mm` (clamped; byte 0 is treated as 1).
          `128` = no difference. Masked cells are `128`.
        - `application/json`: `DiffStats` (includes `max_abs_diff_mm` needed to decode the PNG).
      parameters:
        - $ref: '#/components/parameters/SimId'
        - name: a
          in: query
          required: true
          description: Baseline rotation ID.
          schema: { $ref: '#/components/schemas/RotationId' }
        - name: b
          in: query
          required: true
          description: Comparison rotation ID.
          schema: { $ref: '#/components/schemas/RotationId' }
      responses:
        '200':
          description: Difference grid (PNG) or its stats (JSON).
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
            application/json:
              schema: { $ref: '#/components/schemas/DiffStats' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Field notes for a terrain (P2)
      description: P2. The front-end may keep notes local-only instead.
      parameters:
        - $ref: '#/components/parameters/TerrainIdQuery'
      responses:
        '200':
          description: Notes, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Note' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notes]
      operationId: createNote
      summary: Create a field note (P2)
      description: P2. The front-end may keep notes local-only instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

components:
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteId' }
    ScanId:
      name: scanId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ScanId' }
    TerrainId:
      name: terrainId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TerrainId' }
    TerrainIdQuery:
      name: terrain_id
      in: query
      required: true
      schema: { $ref: '#/components/schemas/TerrainId' }
    SimId:
      name: simId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SimulationId' }
    RotationIdPath:
      name: rotationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RotationId' }

  headers:
    ImmutableCache:
      description: Asset files are immutable per ID.
      schema:
        type: string
        const: public, max-age=31536000, immutable

  responses:
    Error:
      description: Error (any code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidInput:
      description: '`INVALID_INPUT` or `TERRAIN_COVERAGE_MISSING`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileTooLarge:
      description: '`FILE_TOO_LARGE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedFile:
      description: '`UNSUPPORTED_FILE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: '`DATA_SOURCE_UNAVAILABLE` or `WEATHER_UNAVAILABLE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- IDs ----------
    SiteId:
      type: string
      pattern: '^site_[A-Za-z0-9_-]+$'
      examples: [site_okanagan_01]
    ScanId:
      type: string
      pattern: '^scan_[A-Za-z0-9_-]+$'
      examples: [scan_abc]
    TerrainId:
      type: string
      pattern: '^terr_[A-Za-z0-9_-]+$'
      examples: [terr_demo_okanagan_01]
    StormId:
      type: string
      pattern: '^storm_[A-Za-z0-9_-]+$'
      examples: [storm_example_1]
    CropId:
      type: string
      pattern: '^crop_[A-Za-z0-9_-]+$'
      examples: [crop_rye_cover]
    RotationId:
      type: string
      pattern: '^rot_[A-Za-z0-9_-]+$'
      examples: [rot_existing]
    SimulationId:
      type: string
      pattern: '^sim_[A-Za-z0-9_-]+$'
      examples: [sim_123]
    InsightId:
      type: string
      pattern: '^ins_[A-Za-z0-9_-]+$'
      examples: [ins_001]
    NoteId:
      type: string
      pattern: '^note_[A-Za-z0-9_-]+$'
      examples: [note_001]

    # ---------- Shared primitives ----------
    Basis:
      type: string
      enum: [measured, derived, modeled, assumed]
    BasisOrRelative:
      type: string
      enum: [measured, derived, modeled, assumed, relative]
    LonLat:
      type: array
      description: WGS84 `[lon, lat]`.
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      minItems: 2
      maxItems: 2
    BBox:
      type: array
      description: WGS84 `[minLon, minLat, maxLon, maxLat]`.
      items: { type: number }
      minItems: 4
      maxItems: 4
      examples: [[-119.6, 49.1, -119.58, 49.12]]
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC.
    LayerName:
      type: string
      enum: [slope, flow_accumulation, depressions, cover_class]

    # ---------- Health ----------
    Health:
      type: object
      required: [status, mode, version]
      properties:
        status: { type: string, const: ok }
        mode: { type: string, enum: [offline, live] }
        version: { type: string, description: 'API (contract) version, e.g. `1.0.0`.' }

    # ---------- TerrainPackage ----------
    Source:
      type: object
      required: [name, role, license, basis]
      properties:
        name: { type: string }
        role: { type: string, enum: [elevation, imagery, weather] }
        resolution_m: { type: number, exclusiveMinimum: 0 }
        license: { type: string }
        url: { type: string }
        basis: { $ref: '#/components/schemas/Basis' }
    TextureInfo:
      type: object
      required: [bounds_wgs84, source, license, attribution]
      properties:
        bounds_wgs84: { $ref: '#/components/schemas/BBox' }
        source: { type: string, enum: [user_upload, open_imagery, nasa_gibs] }
        resolution_m: { type: number, exclusiveMinimum: 0 }
        license: { type: string }
        attribution: { type: string }
    QualityFlag:
      type: string
      description: |
        Open set; known values: `coarse_elevation`, `dsm_includes_vegetation`,
        `texture_alignment_assumed`, `low_resolution_texture`.
      examples: [coarse_elevation, dsm_includes_vegetation, texture_alignment_assumed, low_resolution_texture]
    TerrainPackage:
      type: object
      description: The single object every capture adapter must produce.
      required: [id, name, bbox_wgs84, crs, grid, elevation, assets, texture, sources, quality_flags, created_at]
      properties:
        id: { $ref: '#/components/schemas/TerrainId' }
        name: { type: string }
        site_id:
          description: Set for curated sites; null for user scans.
          oneOf:
            - $ref: '#/components/schemas/SiteId'
            - type: 'null'
        bbox_wgs84: { $ref: '#/components/schemas/BBox' }
        crs: { type: string, description: 'Local projected CRS, e.g. `EPSG:32611`.', examples: ['EPSG:32611'] }
        grid:
          type: object
          required: [width, height, cell_size_m, nodata_fraction]
          properties:
            width: { type: integer, minimum: 1 }
            height: { type: integer, minimum: 1 }
            cell_size_m: { type: number, exclusiveMinimum: 0 }
            nodata_fraction: { type: number, minimum: 0, maximum: 1 }
        elevation:
          type: object
          required: [min_m, max_m, model, vertical_datum]
          properties:
            min_m: { type: number }
            max_m: { type: number }
            model: { type: string, enum: [DTM, DSM] }
            vertical_datum: { type: string, examples: [to_verify] }
        assets:
          type: object
          required: [heightmap, normal_map, texture, layers]
          properties:
            heightmap: { type: string, description: URL path to `heightmap.png`. }
            normal_map: { type: string, description: URL path to `normal.png`. }
            texture: { type: string, description: URL path to `texture.jpg`. }
            layers:
              type: object
              required: [slope, flow_accumulation, depressions, cover_class]
              properties:
                slope: { type: string }
                flow_accumulation: { type: string }
                depressions: { type: string }
                cover_class: { type: string }
              additionalProperties: false
        texture: { $ref: '#/components/schemas/TextureInfo' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        quality_flags:
          type: array
          items: { $ref: '#/components/schemas/QualityFlag' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- Site ----------
    Site:
      type: object
      required: [id, name, region, summary, relief_m, area_ha, terrain_id, preview_image, pre_built, storm_ids, attribution]
      properties:
        id: { $ref: '#/components/schemas/SiteId' }
        name: { type: string }
        region: { type: string, enum: [Okanagan, Fraser Valley, Metro Vancouver, other] }
        summary: { type: string }
        relief_m: { type: number, minimum: 0 }
        area_ha: { type: number, exclusiveMinimum: 0 }
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        preview_image: { type: string, examples: [/assets/sites/okanagan_01.jpg] }
        pre_built: { type: boolean, description: Show the "Pre-built" badge when true. }
        storm_ids:
          type: array
          items: { $ref: '#/components/schemas/StormId' }
        attribution:
          type: array
          items: { type: string }

    # ---------- Storm ----------
    Storm:
      type: object
      required: [id, label, start, end, total_mm, peak_day_mm, antecedent_wetness, hyetograph, weather_source]
      properties:
        id: { $ref: '#/components/schemas/StormId' }
        label: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        total_mm: { type: number, minimum: 0 }
        peak_day_mm: { type: number, minimum: 0 }
        antecedent_wetness:
          type: number
          minimum: 0
          maximum: 1
          description: Mean root-zone soil wetness over the prior days (0–1 fraction, NASA POWER). TODO(verify) parameter.
        hyetograph:
          type: object
          required: [step_minutes, mm, synthetic, profile]
          properties:
            step_minutes: { type: integer, minimum: 1 }
            mm:
              type: array
              description: Rainfall per step, millimeters.
              items: { type: number, minimum: 0 }
            synthetic: { type: boolean, description: True when daily totals were spread over hours with an assumed profile. }
            profile: { type: string, examples: [design_storm_assumed] }
        weather_source:
          type: object
          required: [name, resolution_km, basis]
          properties:
            name: { type: string, examples: [NASA POWER] }
            resolution_km: { type: number, exclusiveMinimum: 0 }
            basis: { $ref: '#/components/schemas/Basis' }

    # ---------- Crops & rotations ----------
    CropTemplate:
      type: object
      required: [id, name, family, n_fixing, season_window, cover_curve, notes, source]
      properties:
        id: { $ref: '#/components/schemas/CropId' }
        name: { type: string }
        family: { type: string, examples: [Poaceae] }
        n_fixing: { type: boolean }
        season_window:
          type: object
          description: Day-of-year window; `terminate_doy < plant_doy` means it overwinters.
          required: [plant_doy, terminate_doy]
          properties:
            plant_doy: { type: integer, minimum: 1, maximum: 366 }
            terminate_doy: { type: integer, minimum: 1, maximum: 366 }
        cover_curve:
          type: array
          description: '`[days_after_planting, cover_fraction]` points, ascending by day; fraction 0–1.'
          items:
            type: array
            prefixItems:
              - { type: integer, minimum: 0 }
              - { type: number, minimum: 0, maximum: 1 }
            minItems: 2
            maxItems: 2
          minItems: 1
        notes: { type: string }
        source: { type: string, description: 'Reference for parameter values, or `to_verify`.' }
    RotationStep:
      type: object
      required: [year, crop_id]
      properties:
        year: { type: integer, minimum: 1 }
        crop_id: { $ref: '#/components/schemas/CropId' }
    CoverCalendar:
      type: object
      required: [days_bare_per_year, monthly_cover]
      properties:
        days_bare_per_year:
          type: array
          description: One value per rotation year.
          items: { type: number, minimum: 0, maximum: 366 }
        monthly_cover:
          type: array
          description: One row per rotation year; each row has 12 monthly cover fractions (Jan–Dec, 0–1).
          items:
            type: array
            items: { type: number, minimum: 0, maximum: 1 }
            minItems: 12
            maxItems: 12
    Rotation:
      type: object
      required: [id, name, is_existing, sequence, cover_calendar]
      properties:
        id: { $ref: '#/components/schemas/RotationId' }
        name: { type: string }
        is_existing: { type: boolean }
        sequence:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RotationStep' }
        cover_calendar: { $ref: '#/components/schemas/CoverCalendar' }
    ValidateRequest:
      type: object
      required: [terrain_id, rotation]
      properties:
        terrain_id:
          $ref: '#/components/schemas/TerrainId'
          description: Used for the location's season-window check.
        rotation:
          type: object
          required: [name, sequence]
          properties:
            base_rotation_id:
              $ref: '#/components/schemas/RotationId'
              description: Preset the user edited, if any.
            name: { type: string }
            sequence:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RotationStep' }
    ValidationWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [same_family_consecutive, outside_season_window, unknown_crop] }
        message: { type: string }
        year: { type: integer, minimum: 1, description: Rotation year the warning applies to. }
    ValidateResult:
      type: object
      required: [valid, warnings]
      properties:
        valid: { type: boolean, description: False only for blocking problems (e.g. `unknown_crop`). }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ValidationWarning' }
        rotation:
          $ref: '#/components/schemas/Rotation'
          description: |
            Present when `valid`. The edited rotation with a stable content-hash ID
            (`rot_custom_…`) and computed cover calendar, usable in `SimulationRequest.rotation_ids`.

    # ---------- Simulation ----------
    SimulationOptions:
      type: object
      properties:
        grid_max: { type: integer, minimum: 16, default: 256 }
        frames: { type: integer, minimum: 1, default: 60 }
        soil_group: { type: string, enum: [A, B, C, D], default: B, description: Hydrologic soil group. }
        soil_group_basis: { $ref: '#/components/schemas/Basis', default: assumed }
    SimulationRequest:
      type: object
      required: [terrain_id, storm_id, rotation_ids]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        storm_id: { $ref: '#/components/schemas/StormId' }
        rotation_ids:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/RotationId' }
        options: { $ref: '#/components/schemas/SimulationOptions' }
    JobStatus:
      type: string
      enum: [queued, running, done, failed]
    RotationResult:
      type: object
      required: [frames, risk, metrics, step_minutes, frame_times_min]
      properties:
        frames: { type: string, description: URL path to the FTW1 frame file. }
        risk: { type: string, description: URL path to the risk PNG. }
        metrics: { $ref: '#/components/schemas/Metrics' }
        step_minutes: { type: number, exclusiveMinimum: 0, description: Minutes between frames. }
        frame_times_min:
          type: array
          description: Time of each frame, minutes from storm start. Length = frame_count.
          items: { type: number, minimum: 0 }
    SimulationStatus:
      type: object
      required: [id, status, progress, cached, results]
      properties:
        id: { $ref: '#/components/schemas/SimulationId' }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: number, minimum: 0, maximum: 1, description: Fraction complete (0–1). }
        cached: { type: boolean }
        results:
          type: object
          description: Keyed by rotation ID. Only rotations that are fully done appear; empty until then.
          propertyNames: { $ref: '#/components/schemas/RotationId' }
          additionalProperties: { $ref: '#/components/schemas/RotationResult' }
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Present when `status` is `failed`.

    Metrics:
      type: object
      description: Per rotation, per storm. Relative comparisons, not predictions.
      required: [runoff_volume_m3, runoff_depth_mm_mean, ponded_area_ha, ponded_peak_depth_cm, erosion_index_mean, erosion_high_share_pct, bare_days_per_year, basis]
      properties:
        runoff_volume_m3: { type: number, minimum: 0 }
        runoff_depth_mm_mean: { type: number, minimum: 0 }
        ponded_area_ha: { type: number, minimum: 0 }
        ponded_peak_depth_cm: { type: number, minimum: 0 }
        erosion_index_mean: { type: number, minimum: 0, maximum: 100, description: Relative index 0–100. }
        erosion_high_share_pct: { type: number, minimum: 0, maximum: 100 }
        bare_days_per_year: { type: number, minimum: 0, maximum: 366 }
        basis:
          type: object
          required: [runoff, ponding, erosion_index]
          properties:
            runoff: { $ref: '#/components/schemas/BasisOrRelative' }
            ponding: { $ref: '#/components/schemas/BasisOrRelative' }
            erosion_index: { $ref: '#/components/schemas/BasisOrRelative' }

    DiffStats:
      type: object
      required: [a, b, quantity, unit, max_abs_diff_mm, mean_diff_mm, changed_area_ha, basis]
      properties:
        a: { $ref: '#/components/schemas/RotationId' }
        b: { $ref: '#/components/schemas/RotationId' }
        quantity: { type: string, const: peak_water_depth }
        unit: { type: string, const: mm }
        max_abs_diff_mm: { type: number, minimum: 0, description: Scale used to encode the diff PNG. }
        mean_diff_mm: { type: number, description: Mean of `b − a` over unmasked cells. }
        changed_area_ha: { type: number, minimum: 0, description: Area where `|b − a|` exceeds 1 mm. }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }

    # ---------- Insights & evidence ----------
    Insight:
      type: object
      required: [id, kind, title, body, why_it_matters, tip, confidence, anchor, data_refs, severity]
      properties:
        id: { $ref: '#/components/schemas/InsightId' }
        kind: { type: string, enum: [terrain, cover, storm, rotation, data_quality] }
        title: { type: string }
        body: { type: string }
        why_it_matters: { type: string }
        tip: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        anchor:
          type: object
          required: [lon, lat, at_time_min]
          properties:
            lon: { type: number, minimum: -180, maximum: 180 }
            lat: { type: number, minimum: -90, maximum: 90 }
            at_time_min:
              type: [number, 'null']
              minimum: 0
              description: Minutes from storm start for timed insights; null otherwise.
        data_refs:
          type: array
          items: { type: string, examples: [layers.slope] }
        severity: { type: integer, minimum: 1, maximum: 5, description: '1 = lowest, 5 = highest.' }
    EvidenceCard:
      type: object
      required: [rotation_id, why_suggested, evidence, benefits, information_gaps, risks_for_local_review, support_not_replace]
      properties:
        rotation_id: { $ref: '#/components/schemas/RotationId' }
        why_suggested: { type: string }
        evidence: { type: array, items: { type: string } }
        benefits: { type: array, items: { type: string } }
        information_gaps: { type: array, items: { type: string } }
        risks_for_local_review: { type: array, items: { type: string } }
        support_not_replace:
          type: string
          const: This tool supports, and does not replace, local agronomic expertise.
    EvidenceBundle:
      type: object
      required: [evidence_cards, insights]
      properties:
        evidence_cards:
          type: array
          items: { $ref: '#/components/schemas/EvidenceCard' }
        insights:
          type: array
          items: { $ref: '#/components/schemas/Insight' }

    # ---------- Scans ----------
    ScanCreateForm:
      type: object
      required: [lat, lon]
      properties:
        images:
          type: array
          description: |
            0–6 photos (JPEG, PNG, WEBP), sent as repeated `images` parts. Optional: with none,
            the back-end uses an open-imagery fallback texture.
          maxItems: 6
          items: { type: string, contentMediaType: application/octet-stream }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        bbox:
          type: string
          description: Optional `minLon,minLat,maxLon,maxLat` (comma-separated WGS84). Default is a server-chosen square around `lat`/`lon`.
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
        name: { type: string, maxLength: 120 }
    ScanCreated:
      type: object
      required: [scan_id]
      properties:
        scan_id: { $ref: '#/components/schemas/ScanId' }
    ProgressStage:
      type: string
      description: In pipeline order.
      enum:
        - queued
        - reading_inputs
        - locating
        - fetching_elevation
        - building_mesh
        - classifying_cover
        - analyzing_drainage
        - fetching_weather
        - packaging
        - ready
        - failed
    ScanStatus:
      type: object
      required: [status, stage, pct]
      properties:
        status: { $ref: '#/components/schemas/JobStatus' }
        stage: { $ref: '#/components/schemas/ProgressStage' }
        pct: { type: number, minimum: 0, maximum: 100 }
        terrain_id:
          $ref: '#/components/schemas/TerrainId'
          description: Present when `status` is `done`.
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Present when `status` is `failed`.
    ProgressEvent:
      type: object
      description: JSON `data` of an SSE `progress` event.
      required: [scan_id, stage, pct, message, ts]
      properties:
        scan_id: { $ref: '#/components/schemas/ScanId' }
        stage: { $ref: '#/components/schemas/ProgressStage' }
        pct: { type: number, minimum: 0, maximum: 100 }
        message: { type: string }
        ts: { $ref: '#/components/schemas/Timestamp' }
        terrain_id:
          $ref: '#/components/schemas/TerrainId'
          description: Present on the `ready` event.
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Present on the `failed` event.

    # ---------- Layers, provenance, weather ----------
    LayerLegend:
      type: object
      required: [name, title, kind, unit, value_range, color_ramp, nodata_value, url, basis]
      properties:
        name: { $ref: '#/components/schemas/LayerName' }
        title: { type: string }
        kind: { type: string, enum: [continuous, categorical] }
        unit: { type: string, description: 'e.g. `degrees`, `cells`, `m`; empty string for categorical.' }
        value_range:
          type: array
          description: |
            Physical `[min, max]`. For continuous layers, `value = min + byte / 254 * (max − min)`
            for bytes 0–254. For categorical layers, the class index range.
          items: { type: number }
          minItems: 2
          maxItems: 2
        color_ramp: { type: string, description: 'Rendering hint, e.g. `viridis`, `blues`, `categorical`.' }
        nodata_value: { type: integer, const: 255 }
        classes:
          type: array
          description: Categorical layers only.
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: integer, minimum: 0, maximum: 254 }
              label: { type: string }
              color: { type: string, description: 'Hex color hint, e.g. `#4caf50`.' }
        url: { type: string, description: URL path to the layer PNG. }
        basis: { $ref: '#/components/schemas/Basis' }
    LayerCatalog:
      type: object
      required: [terrain_id, layers]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        layers:
          type: array
          items: { $ref: '#/components/schemas/LayerLegend' }
    ProvenanceDataset:
      allOf:
        - $ref: '#/components/schemas/Source'
        - type: object
          properties:
            attribution: { type: string }
            date_range:
              type: object
              required: [start, end]
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
    Assumption:
      type: object
      required: [statement, basis]
      properties:
        statement: { type: string, examples: [Soil hydrologic group B assumed everywhere.] }
        basis: { $ref: '#/components/schemas/Basis' }
    Provenance:
      type: object
      required: [terrain_id, datasets, quality_flags, assumptions, limitations]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        datasets:
          type: array
          items: { $ref: '#/components/schemas/ProvenanceDataset' }
        texture: { $ref: '#/components/schemas/TextureInfo' }
        quality_flags:
          type: array
          items: { $ref: '#/components/schemas/QualityFlag' }
        assumptions:
          type: array
          items: { $ref: '#/components/schemas/Assumption' }
        limitations:
          type: array
          items: { type: string }
    TrendSeries:
      type: object
      required: [id, label, unit, points, trend, summary, basis]
      properties:
        id:
          type: string
          description: 'Known ids: `annual_precip_mm`, `heavy_rain_days`, `temp_mean_c`, `root_zone_wetness`.'
          examples: [annual_precip_mm]
        label: { type: string }
        unit: { type: string, examples: [mm, days, degC, fraction] }
        points:
          type: array
          items:
            type: object
            required: [year, value]
            properties:
              year: { type: integer }
              value: { type: number }
        trend:
          type: object
          required: [method, slope_per_decade, ci_low, ci_high, ci_level]
          properties:
            method: { type: string, const: theil_sen }
            slope_per_decade: { type: number, description: Series unit per decade. }
            ci_low: { type: number }
            ci_high: { type: number }
            ci_level: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, examples: [0.95] }
        summary: { type: string, description: Plain-language sentence. }
        basis: { $ref: '#/components/schemas/Basis' }
    WeatherSummary:
      type: object
      required: [lat, lon, period, source, cached, series]
      properties:
        lat: { type: number }
        lon: { type: number }
        period:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        source:
          type: object
          required: [name, resolution_km, basis]
          properties:
            name: { type: string, examples: [NASA POWER] }
            resolution_km: { type: number, exclusiveMinimum: 0 }
            basis: { $ref: '#/components/schemas/Basis' }
        cached: { type: boolean, description: True when served from the on-disk cache after an upstream failure. }
        series:
          type: array
          items: { $ref: '#/components/schemas/TrendSeries' }

    # ---------- Notes ----------
    NoteCreate:
      type: object
      required: [terrain_id, anchor, body]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        anchor: { $ref: '#/components/schemas/LonLat' }
        body: { type: string, minLength: 1, maxLength: 2000 }
        parent_id:
          $ref: '#/components/schemas/NoteId'
          description: Set for replies in a thread.
        author: { type: string, maxLength: 80, description: Display name; no accounts. }
    Note:
      allOf:
        - $ref: '#/components/schemas/NoteCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { $ref: '#/components/schemas/NoteId' }
            created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- Errors ----------
    ErrorCode:
      type: string
      description: |
        HTTP status mapping: INVALID_INPUT 422, UNSUPPORTED_FILE 415, FILE_TOO_LARGE 413,
        TERRAIN_COVERAGE_MISSING 422, DATA_SOURCE_UNAVAILABLE 503, WEATHER_UNAVAILABLE 503,
        SIMULATION_TIMEOUT 504, NOT_FOUND 404, INTERNAL 500.
      enum:
        - INVALID_INPUT
        - UNSUPPORTED_FILE
        - FILE_TOO_LARGE
        - TERRAIN_COVERAGE_MISSING
        - DATA_SOURCE_UNAVAILABLE
        - WEATHER_UNAVAILABLE
        - SIMULATION_TIMEOUT
        - NOT_FOUND
        - INTERNAL
    ErrorBody:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        hint: { type: string }
        retryable: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
