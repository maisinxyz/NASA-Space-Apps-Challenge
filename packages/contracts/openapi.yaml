openapi: 3.1.0
info:
  title: FieldTwin API
  version: "1.4.0"
  summary: Interface contract between the FieldTwin front-end and back-end (PRD §6).
  description: |
    Encodes `prd.md` §6. Endpoints, schemas, and formats are our own design.
    Decisions made where the PRD was loose are listed in `docs/progress/02.md` ("Decisions").

    v1.4.0 adds an optional first-year planting comparison to each forecast field.
    The response continues to use the existing forecast strategy and evidence schemas.

    v1.3.0 (docs/fieldtwin-v4-prd.md Appendix A, additive) adds the monthly outlook,
    the farm co-pilot chat, custom-field analysis (2D view only), an optional
    `rotation_explanation` on each forecast strategy, and the `RATE_LIMITED` error code.
    `Forecast.schema_version` stays `1.2.0`.

    v1.2.0 (forecast, docs/backend-forecast-prd.md) adds climate-outlook, exposure,
    crop-catalog, forecast, and forecast sensitivity. Those responses may include
    absolute scenario estimates (yield, forage, income, fertilizer, soil loss).
    Each estimate has a unit, a basis, a confidence, and a p10/p90 range.
    Storm-replay simulation metrics stay relative comparisons.

    Conventions (PRD §6.1):
    - JSON unless stated. UTF-8. Timestamps ISO 8601 UTC.
    - IDs are short strings with a type prefix (`terr_`, `scan_`, `storm_`, `rot_`, `sim_`, ...).
    - Public coordinates are WGS84 `[lon, lat]`; bounding boxes are `[minLon, minLat, maxLon, maxLat]`.
      Internal grids use a local projected CRS (UTM) declared in `TerrainPackage.crs`.
    - Units: meters, millimeters, degrees, percent. Units are carried in field names (`_m`, `_mm`, `_ha`, `_pct`, ...).
    - Modeled values carry a `basis` of `measured | derived | modeled | assumed` (plus `relative` where §6.2 uses it).
    - Errors use one format everywhere (`Error`).
    - Asset files (PNG, JPEG, frame files) are immutable per ID and are served with
      `Cache-Control: public, max-age=31536000, immutable`.
    - Raster grids (heightmap, normal map, layers, risk, diff, frames) are row-major,
      row 0 = north edge, column 0 = west edge, and share the TerrainPackage grid
      (`grid.width` x `grid.height`) unless a simulation was downsampled (frames carry their own width/height).

    Storm-replay simulation outputs are relative comparisons. Forecast endpoints (v1.2.0)
    are scenario estimates with unit, basis, confidence, and range, not yield predictions
    to act on without local review.
servers:
  - url: /api/v1
    description: Same-origin base path
security: []  # No authentication: public demo API, no accounts.
tags:
  - name: system
    description: Liveness and mode.
  - name: sites
    description: Curated (pre-built) demo sites.
  - name: scans
    description: Land Scan jobs and progress events.
  - name: terrain
    description: TerrainPackage metadata, assets, layers, insights, provenance.
  - name: weather
    description: NASA POWER storms and long-term trends.
  - name: crops
    description: Crop library and rotations.
  - name: simulations
    description: Storm replays per rotation, evidence, differences.
  - name: notes
    description: Field notes (P2).
  - name: copilot
    description: Farm co-pilot chat (contract v1.3.0).
  - name: forecast
    description: Ten-year scenario forecast (contract v1.2.0). Backend only; the web app is unchanged.

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness and mode
      responses:
        '200':
          description: API is up.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        default: { $ref: '#/components/responses/Error' }

  /sites:
    get:
      tags: [sites]
      operationId: listSites
      summary: List curated sites
      responses:
        '200':
          description: Curated (pre-built) sites.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Site' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}:
    get:
      tags: [sites]
      operationId: getSite
      summary: One site
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: The site.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Site' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/features:
    get:
      tags: [sites]
      operationId: getSiteFeatures
      summary: Weekly feature table and data-quality flags (v1.1)
      description: |
        52-week feature table built from NASA POWER daily data (plus seeded soil/satellite data where present).
        Every series carries a unit and a basis. A scenario reweights observed years; it is not a forecast.
        Curated sites run the full pipeline; any other site with a `location` runs limited-data mode.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ScenarioQuery'
      responses:
        '200':
          description: Feature table.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureTable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/hazard-calendar:
    get:
      tags: [sites]
      operationId: getHazardCalendar
      summary: Weekly heavy-rain-on-wet-ground and dry-spell shares (v1.1)
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ScenarioQuery'
      responses:
        '200':
          description: Hazard calendar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HazardCalendar' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/hazards:
    get:
      tags: [sites]
      operationId: getHazardCatalog
      summary: Hazard types with years-with-event counts (v1.1)
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Hazard catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HazardCatalog' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/zones:
    get:
      tags: [sites]
      operationId: getZones
      summary: Derived vulnerability zones (v1.1)
      description: Derived from terrain and soil data, never field-measured. Empty when the site has no terrain package.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      responses:
        '200':
          description: Zones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneCollection' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/compare:
    get:
      tags: [sites]
      operationId: compareRotations
      summary: Winter and summer exposure per rotation (v1.1)
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: rotations
          in: query
          required: true
          description: Comma-separated rotation IDs, e.g. `rot_existing,rot_cover,rot_forage`.
          schema: { type: string }
        - $ref: '#/components/parameters/ScenarioQuery'
      responses:
        '200':
          description: Exposure comparison.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotationComparison' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/rotation-analysis:
    post:
      tags: [crops]
      operationId: analyzeRotations
      summary: Farmer request to three scored rotations with evidence (v1.1)
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RotationAnalysisRequest' }
      responses:
        '200':
          description: Relative comparison of the existing rotation and up to two alternatives.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RotationAnalysis' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/climate-outlook:
    get:
      tags: [forecast]
      operationId: getClimateOutlook
      summary: Group 1 climate outlook for one scenario (v1.2.0)
      description: |
        Seasonal temperature drift, heat-stress days, frost windows, rainfall extremes,
        ET and soil-moisture anomalies, water-balance climatology, and regional groundwater
        context. Does not run rotation strategies. Cached responses are the fast path.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/ScenarioQuery'
      responses:
        '200':
          description: Climate outlook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClimateOutlook' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/exposure:
    get:
      tags: [forecast]
      operationId: getExposure
      summary: Group 2 field exposure for a crop list (v1.2.0)
      description: |
        Vulnerable seasons, bare-field windows, and erosion, water-stress, and frost-pocket
        zones. `crops` defaults to the site's existing rotation preset. Coarse layers return
        one farm-level value with `resolution_note` instead of invented sub-field pixels.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - $ref: '#/components/parameters/CropsQuery'
      responses:
        '200':
          description: Exposure report. The component is `ForecastExposure` because v1.1 already uses the name `Exposure`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ForecastExposure' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/forecast:
    post:
      tags: [forecast]
      operationId: createForecast
      summary: Year 1–10 forecast for the farmer's strategies (v1.2.0)
      description: |
        Groups 3, 4, and most of 5. Per field, then an area-weighted farm rollup.
        Income is null when the farmer did not enter prices. Same request bytes in, same bytes out.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForecastRequest' }
      responses:
        '200':
          description: Forecast. Index 0 of each field's `strategies` is that field's existing rotation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Forecast' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/forecast/sensitivity:
    post:
      tags: [forecast]
      operationId: createForecastSensitivity
      summary: Rain by temperature sensitivity grid (v1.2.0)
      description: Same body as `/forecast`. Kept separate so the first forecast paint does not wait for the grid.
      parameters:
        - $ref: '#/components/parameters/SiteId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForecastRequest' }
      responses:
        '200':
          description: Sensitivity grid at Year 10.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensitivityGrid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /crop-catalog:
    get:
      tags: [crops]
      operationId: listCropCatalog
      summary: Selectable crops with trait schema v2 (v1.2.0)
      description: |
        Vegetables, grains, forage, covers, and fruit perennials. `/crops` is unchanged.
        Every trait on a returned crop has a `trait_sources` entry (URL or `TODO(verify)`).
        Null numeric traits are not verified and must not be replaced with a silent default.
      parameters:
        - $ref: '#/components/parameters/CatalogCategory'
        - $ref: '#/components/parameters/CatalogSiteId'
      responses:
        '200':
          description: Crop catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CropCatalog' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /sites/{siteId}/outlook:
    get:
      tags: [forecast]
      operationId: getOutlook
      summary: Monthly outlook for up to 12 months (v1.3.0)
      description: |
        Typical-year (`climatology`) monthly outlook from the observed weather record plus the
        engine water balance. A month whose values come from a real seasonal forecast has
        `kind: seasonal_forecast`; the top-level `kind` is `seasonal_forecast` when at least one
        month does. Ranges widen with the month index.
      parameters:
        - $ref: '#/components/parameters/SiteId'
        - name: months
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 12, default: 12 }
        - $ref: '#/components/parameters/ScenarioQuery'
      responses:
        '200':
          description: Monthly outlook.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Outlook' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /copilot/chat:
    post:
      tags: [copilot]
      operationId: postCopilotChat
      summary: Farm co-pilot reply (v1.3.0)
      description: |
        Plain-language answer about the current screen. The server builds the numbers from the
        snapshot; the client never sends forecast values. Replies are not deterministic and never
        change a forecast number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CopilotChatRequest' }
      responses:
        '200':
          description: Co-pilot reply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CopilotChatResponse' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /field/analyze:
    post:
      tags: [forecast]
      operationId: postFieldAnalyze
      summary: Custom polygon analysis, 2D view only (v1.3.0)
      description: |
        Runs the forecast for one user-drawn field. The polygon is WGS84 `[lon, lat]`, one closed
        ring, at most 200 ha; otherwise `INVALID_INPUT`. Lookups are cached by request hash.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FieldAnalyzeRequest' }
      responses:
        '200':
          description: Analysis for the drawn field.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FieldAnalyzeResponse' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /scans:
    post:
      tags: [scans]
      operationId: createScan
      summary: Start a Land Scan
      description: |
        Validates input, creates a job, and returns `scan_id` immediately. Re-submitting identical
        input returns the existing job (idempotent). With `OFFLINE=1`, only curated sites are accepted.
        Uploaded images supply appearance only; elevation always comes from open data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ScanCreateForm' }
            encoding:
              images:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '202':
          description: Scan job accepted (new or existing).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanCreated' }
        '413': { $ref: '#/components/responses/FileTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedFile' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /scans/{scanId}:
    get:
      tags: [scans]
      operationId: getScan
      summary: Scan status and result
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: Current scan status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /scans/{scanId}/events:
    get:
      tags: [scans]
      operationId: streamScanEvents
      summary: Server-sent progress events
      description: |
        Server-Sent Events stream (PRD §6.5). Every message uses event name `progress` and a JSON
        `data` payload matching `ProgressEvent`:

        ```
        event: progress
        data: {"scan_id":"scan_abc","stage":"building_mesh","pct":45,"message":"Building terrain mesh","ts":"2026-11-14T18:00:05Z"}
        ```

        Stages arrive in enum order. The stream ends after a `ready` event (which includes
        `terrain_id`) or a `failed` event (which includes `error`).
      parameters:
        - $ref: '#/components/parameters/ScanId'
      responses:
        '200':
          description: SSE stream; each `data:` line is a JSON `ProgressEvent`.
          content:
            text/event-stream:
              schema:
                type: string
                description: Raw SSE text. Each event's `data` decodes to `ProgressEvent`.
              x-sse-data-schema: { $ref: '#/components/schemas/ProgressEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}:
    get:
      tags: [terrain]
      operationId: getTerrain
      summary: TerrainPackage metadata
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: The terrain package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TerrainPackage' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/heightmap.png:
    get:
      tags: [terrain]
      operationId: getHeightmap
      summary: 16-bit heightmap
      description: |
        16-bit grayscale PNG, `grid.width` x `grid.height`.
        `elevation_m = elevation.min_m + (value / 65535) * (elevation.max_m - elevation.min_m)`.
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Heightmap PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/normal.png:
    get:
      tags: [terrain]
      operationId: getNormalMap
      summary: Normal map
      description: |
        8-bit RGB PNG, same size as the heightmap. Each channel encodes one component of the unit
        surface normal as `n = byte / 255 * 2 - 1`; R = +x (east), G = +y (north), B = +z (up).
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Normal map PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/texture.jpg:
    get:
      tags: [terrain]
      operationId: getTexture
      summary: Draped imagery
      description: JPEG (max 2048x2048) covering `texture.bounds_wgs84`.
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Texture JPEG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/jpeg:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/layers:
    get:
      tags: [terrain]
      operationId: getLayerCatalog
      summary: Layer catalog with legends
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Layer catalog.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LayerCatalog' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/layers/{name}.png:
    get:
      tags: [terrain]
      operationId: getLayer
      summary: A single analysis layer
      description: |
        8-bit grayscale PNG, same grid as the heightmap. Decode with the matching `LayerLegend`
        from `GET /terrain/{terrainId}/layers`. `cover_class` uses indexed values
        `0 other`, `1 vegetation`, `2 bare soil`, `3 water`, `255 nodata`.
      parameters:
        - $ref: '#/components/parameters/TerrainId'
        - name: name
          in: path
          required: true
          schema: { $ref: '#/components/schemas/LayerName' }
      responses:
        '200':
          description: Layer PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/insights:
    get:
      tags: [terrain]
      operationId: getTerrainInsights
      summary: Terrain and cover insights
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Insights, sorted by severity (highest first).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Insight' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /terrain/{terrainId}/provenance:
    get:
      tags: [terrain]
      operationId: getProvenance
      summary: Data sources, assumptions, limits
      parameters:
        - $ref: '#/components/parameters/TerrainId'
      responses:
        '200':
          description: Provenance for this terrain package.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Provenance' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /weather/summary:
    get:
      tags: [weather]
      operationId: getWeatherSummary
      summary: Trend summary 1981–present
      parameters:
        - name: lat
          in: query
          required: true
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: lon
          in: query
          required: true
          schema: { type: number, minimum: -180, maximum: 180 }
      responses:
        '200':
          description: Weather trend summary.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WeatherSummary' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /weather/storms:
    get:
      tags: [weather]
      operationId: listStorms
      summary: Ranked storm list
      parameters:
        - $ref: '#/components/parameters/TerrainIdQuery'
      responses:
        '200':
          description: Storms ranked from largest to smallest.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Storm' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/Unavailable' }
        default: { $ref: '#/components/responses/Error' }

  /crops:
    get:
      tags: [crops]
      operationId: listCrops
      summary: Crop library
      responses:
        '200':
          description: Crop templates, with trait fields where curated (v1.1).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CropTrait' }
        default: { $ref: '#/components/responses/Error' }

  /glossary:
    get:
      tags: [crops]
      operationId: listGlossary
      summary: Glossary terms and crop-type explainers (v1.1, static, works offline)
      responses:
        '200':
          description: Glossary entries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GlossaryEntry' }
        default: { $ref: '#/components/responses/Error' }

  /rotations/presets:
    get:
      tags: [crops]
      operationId: listRotationPresets
      summary: Existing plus two suggested rotations
      parameters:
        - $ref: '#/components/parameters/TerrainIdQuery'
      responses:
        '200':
          description: Exactly three rotations, existing first.
          content:
            application/json:
              schema:
                type: array
                minItems: 3
                maxItems: 3
                items: { $ref: '#/components/schemas/Rotation' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /rotations/validate:
    post:
      tags: [crops]
      operationId: validateRotation
      summary: Validate a user-edited rotation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ValidateRequest' }
      responses:
        '200':
          description: Validation result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidateResult' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /simulations:
    post:
      tags: [simulations]
      operationId: createSimulation
      summary: Run or fetch cached simulation
      description: |
        Cached by hash of (terrain, storm, rotation, options). Returns `200` with `cached: true`
        when a finished result exists, else `202` with a queued or running status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SimulationRequest' }
      responses:
        '200':
          description: Finished (cached) simulation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationStatus' }
        '202':
          description: Simulation queued or running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}:
    get:
      tags: [simulations]
      operationId: getSimulation
      summary: Status and result links
      parameters:
        - $ref: '#/components/parameters/SimId'
      responses:
        '200':
          description: Simulation status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimulationStatus' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/frames/{rotationId}.bin:
    get:
      tags: [simulations]
      operationId: getFrames
      summary: Water-depth frames
      description: |
        Binary, little-endian, one file per rotation per simulation (PRD §6.4). "FTW1" format:

        ```
        bytes 0-3    magic "FTW1"
        bytes 4-5    u16 width
        bytes 6-7    u16 height
        bytes 8-9    u16 frame_count
        byte  10     u8  dtype (1 = uint8)
        byte  11     u8  reserved
        bytes 12-15  f32 max_depth_mm (value 255 maps to this depth)
        bytes 16-... frame_count * width * height bytes, frames in time order
        ```

        `depth_mm = byte * max_depth_mm / 255`. Each frame is row-major, row 0 = north edge.
        Frame timing (`step_minutes`, `frame_times_min`) is in the matching `RotationResult`
        of the simulation status. Target size under about 5 MB; served with gzip
        (`Content-Encoding: gzip`) when the client accepts it.
      parameters:
        - $ref: '#/components/parameters/SimId'
        - $ref: '#/components/parameters/RotationIdPath'
      responses:
        '200':
          description: FTW1 frame file.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            application/octet-stream:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/risk/{rotationId}.png:
    get:
      tags: [simulations]
      operationId: getRisk
      summary: Relative erosion-risk grid
      description: |
        8-bit grayscale PNG. Byte value = relative erosion-risk index 0–100 (basis `relative`);
        `255` = masked / nodata (water, structures, outside field). Not an absolute soil-loss figure.
      parameters:
        - $ref: '#/components/parameters/SimId'
        - $ref: '#/components/parameters/RotationIdPath'
      responses:
        '200':
          description: Risk PNG.
          headers:
            Cache-Control: { $ref: '#/components/headers/ImmutableCache' }
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/evidence:
    get:
      tags: [simulations]
      operationId: getEvidence
      summary: Evidence cards and insights for the run
      parameters:
        - $ref: '#/components/parameters/SimId'
      responses:
        '200':
          description: Evidence cards (one per rotation) and run insights.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceBundle' }
        '404': { $ref: '#/components/responses/NotFound' }
        default: { $ref: '#/components/responses/Error' }

  /simulations/{simId}/diff:
    get:
      tags: [simulations]
      operationId: getDiff
      summary: Difference grid between two rotations
      description: |
        Content-negotiated on `Accept`:
        - `image/png`: 8-bit grayscale difference grid of peak water depth, `b − a`.
          `diff_mm = (byte − 128) / 127 * max_abs_diff_mm` (clamped; byte 0 is treated as 1).
          `128` = no difference. Masked cells are `128`.
        - `application/json`: `DiffStats` (includes `max_abs_diff_mm` needed to decode the PNG).
      parameters:
        - $ref: '#/components/parameters/SimId'
        - name: a
          in: query
          required: true
          description: Baseline rotation ID.
          schema: { $ref: '#/components/schemas/RotationId' }
        - name: b
          in: query
          required: true
          description: Comparison rotation ID.
          schema: { $ref: '#/components/schemas/RotationId' }
      responses:
        '200':
          description: Difference grid (PNG) or its stats (JSON).
          content:
            image/png:
              schema: { type: string, contentEncoding: binary }
            application/json:
              schema: { $ref: '#/components/schemas/DiffStats' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

  /notes:
    get:
      tags: [notes]
      operationId: listNotes
      summary: Field notes for a terrain (P2)
      description: P2. The front-end may keep notes local-only instead.
      parameters:
        - $ref: '#/components/parameters/TerrainIdQuery'
      responses:
        '200':
          description: Notes, oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Note' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [notes]
      operationId: createNote
      summary: Create a field note (P2)
      description: P2. The front-end may keep notes local-only instead.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NoteCreate' }
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Note' }
        '422': { $ref: '#/components/responses/InvalidInput' }
        default: { $ref: '#/components/responses/Error' }

components:
  parameters:
    SiteId:
      name: siteId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SiteId' }
    ScanId:
      name: scanId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/ScanId' }
    TerrainId:
      name: terrainId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/TerrainId' }
    TerrainIdQuery:
      name: terrain_id
      in: query
      required: true
      schema: { $ref: '#/components/schemas/TerrainId' }
    SimId:
      name: simId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/SimulationId' }
    RotationIdPath:
      name: rotationId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/RotationId' }

    ScenarioQuery:
      name: scenario
      in: query
      required: false
      schema: { $ref: '#/components/schemas/Scenario' }
    CropsQuery:
      name: crops
      in: query
      required: false
      description: Comma-separated crop ids. When omitted, the site's existing rotation preset is used.
      schema: { type: string }
    CatalogCategory:
      name: category
      in: query
      required: false
      schema: { $ref: '#/components/schemas/CropCategory' }
    CatalogSiteId:
      name: site_id
      in: query
      required: false
      description: When set, the list is limited to crops whose `region_fit` includes that site's climate class. Empty `region_fit` is returned until a fit is verified.
      schema: { $ref: '#/components/schemas/SiteId' }

  headers:
    ImmutableCache:
      description: Asset files are immutable per ID.
      schema:
        type: string
        const: public, max-age=31536000, immutable

  responses:
    Error:
      description: Error (any code).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: '`NOT_FOUND` or `SITE_NOT_FOUND`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvalidInput:
      description: '`INVALID_INPUT`, `TERRAIN_COVERAGE_MISSING`, `UNKNOWN_CROP`, `INVALID_WEIGHTS`, `NO_FEASIBLE_ALTERNATIVES`, `SCENARIO_OUT_OF_RANGE`, `SELECTION_TOO_SMALL`, `INVALID_QUOTA` or `HORIZON_OUT_OF_RANGE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    FileTooLarge:
      description: '`FILE_TOO_LARGE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedFile:
      description: '`UNSUPPORTED_FILE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: '`DATA_SOURCE_UNAVAILABLE` or `WEATHER_UNAVAILABLE`'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: '`RATE_LIMITED` (retryable true)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ---------- IDs ----------
    SiteId:
      type: string
      pattern: '^site_[A-Za-z0-9_-]+$'
      examples: [site_okanagan_01]
    ScanId:
      type: string
      pattern: '^scan_[A-Za-z0-9_-]+$'
      examples: [scan_abc]
    TerrainId:
      type: string
      pattern: '^terr_[A-Za-z0-9_-]+$'
      examples: [terr_demo_okanagan_01]
    StormId:
      type: string
      pattern: '^storm_[A-Za-z0-9_-]+$'
      examples: [storm_example_1]
    CropId:
      type: string
      pattern: '^crop_[A-Za-z0-9_-]+$'
      examples: [crop_rye_cover]
    RotationId:
      type: string
      pattern: '^rot_[A-Za-z0-9_-]+$'
      examples: [rot_existing]
    SimulationId:
      type: string
      pattern: '^sim_[A-Za-z0-9_-]+$'
      examples: [sim_123]
    InsightId:
      type: string
      pattern: '^ins_[A-Za-z0-9_-]+$'
      examples: [ins_001]
    NoteId:
      type: string
      pattern: '^note_[A-Za-z0-9_-]+$'
      examples: [note_001]

    # ---------- Shared primitives ----------
    Basis:
      type: string
      enum: [measured, derived, modeled, assumed]
    BasisOrRelative:
      type: string
      enum: [measured, derived, modeled, assumed, relative]
    LonLat:
      type: array
      description: WGS84 `[lon, lat]`.
      prefixItems:
        - { type: number, minimum: -180, maximum: 180 }
        - { type: number, minimum: -90, maximum: 90 }
      minItems: 2
      maxItems: 2
    BBox:
      type: array
      description: WGS84 `[minLon, minLat, maxLon, maxLat]`.
      items: { type: number }
      minItems: 4
      maxItems: 4
      examples: [[-119.6, 49.1, -119.58, 49.12]]
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 UTC.
    LayerName:
      type: string
      description: Clients render unknown values neutrally.
      enum: [slope, flow_accumulation, depressions, cover_class, wetness_index, planting_suitability, soil_moisture_relative, irrigation_priority, water_received]

    # ---------- Health ----------
    Health:
      type: object
      required: [status, mode, version]
      properties:
        status: { type: string, const: ok }
        mode: { type: string, enum: [offline, live] }
        version: { type: string, description: 'API (contract) version, e.g. `1.0.0`.' }

    # ---------- TerrainPackage ----------
    Source:
      type: object
      required: [name, role, license, basis]
      properties:
        name: { type: string }
        role: { type: string, enum: [elevation, imagery, weather, soil, vegetation, soil_moisture, crop_traits] }
        resolution_m: { type: number, exclusiveMinimum: 0 }
        license: { type: string }
        url: { type: string }
        attribution: { type: string, description: Credit line to show (v1.1). }
        retrieved_on: { type: string, format: date }
        basis: { $ref: '#/components/schemas/Basis' }
    TextureInfo:
      type: object
      required: [bounds_wgs84, source, license, attribution]
      properties:
        bounds_wgs84: { $ref: '#/components/schemas/BBox' }
        source: { type: string, enum: [user_upload, open_imagery, nasa_gibs] }
        resolution_m: { type: number, exclusiveMinimum: 0 }
        license: { type: string }
        attribution: { type: string }
    QualityFlag:
      type: string
      description: |
        Open set; known values: `coarse_elevation`, `dsm_includes_vegetation`,
        `texture_alignment_assumed`, `low_resolution_texture`.
      examples: [coarse_elevation, dsm_includes_vegetation, texture_alignment_assumed, low_resolution_texture]
    TerrainPackage:
      type: object
      description: The single object every capture adapter must produce.
      required: [id, name, bbox_wgs84, crs, grid, elevation, assets, texture, sources, quality_flags, created_at]
      properties:
        id: { $ref: '#/components/schemas/TerrainId' }
        name: { type: string }
        site_id:
          description: Set for curated sites; null for user scans.
          oneOf:
            - $ref: '#/components/schemas/SiteId'
            - type: 'null'
        bbox_wgs84: { $ref: '#/components/schemas/BBox' }
        crs: { type: string, description: 'Local projected CRS, e.g. `EPSG:32611`.', examples: ['EPSG:32611'] }
        grid:
          type: object
          required: [width, height, cell_size_m, nodata_fraction]
          properties:
            width: { type: integer, minimum: 1 }
            height: { type: integer, minimum: 1 }
            cell_size_m: { type: number, exclusiveMinimum: 0 }
            nodata_fraction: { type: number, minimum: 0, maximum: 1 }
        elevation:
          type: object
          required: [min_m, max_m, model, vertical_datum]
          properties:
            min_m: { type: number }
            max_m: { type: number }
            model: { type: string, enum: [DTM, DSM] }
            vertical_datum: { type: string, examples: [to_verify] }
        assets:
          type: object
          required: [heightmap, normal_map, texture, layers]
          properties:
            heightmap: { type: string, description: URL path to `heightmap.png`. }
            normal_map: { type: string, description: URL path to `normal.png`. }
            texture: { type: string, description: URL path to `texture.jpg`. }
            layers:
              type: object
              required: [slope, flow_accumulation, depressions, cover_class]
              properties:
                slope: { type: string }
                flow_accumulation: { type: string }
                depressions: { type: string }
                cover_class: { type: string }
              additionalProperties: false
        texture: { $ref: '#/components/schemas/TextureInfo' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        quality_flags:
          type: array
          items: { $ref: '#/components/schemas/QualityFlag' }
        created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- Site ----------
    Site:
      type: object
      required: [id, name, region, summary, relief_m, area_ha, terrain_id, preview_image, pre_built, storm_ids, attribution]
      properties:
        id: { $ref: '#/components/schemas/SiteId' }
        name: { type: string }
        region: { type: string, enum: [Okanagan, Fraser Valley, Metro Vancouver, other] }
        summary: { type: string }
        relief_m: { type: number, minimum: 0 }
        area_ha: { type: number, exclusiveMinimum: 0 }
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        preview_image: { type: string, examples: [/assets/sites/okanagan_01.jpg] }
        pre_built: { type: boolean, description: Show the "Pre-built" badge when true. }
        storm_ids:
          type: array
          items: { $ref: '#/components/schemas/StormId' }
        attribution:
          type: array
          items: { type: string }
        country: { type: string }
        locality: { type: string }
        owner: { type: string }
        location: { $ref: '#/components/schemas/LonLat' }
        coords_verified: { type: boolean, description: False shows "Approximate location". }
        source_url: { type: string, format: uri }
        tier: { type: string, enum: [twin, explore], description: '`twin` = curated full data (Pre-built); `explore` = Lite mode.' }
        sim_bbox: { $ref: '#/components/schemas/BBox' }
        radius_m: { type: number, exclusiveMinimum: 0 }

    # ---------- Storm ----------
    Storm:
      type: object
      required: [id, label, start, end, total_mm, peak_day_mm, antecedent_wetness, hyetograph, weather_source]
      properties:
        id: { $ref: '#/components/schemas/StormId' }
        label: { type: string }
        start: { type: string, format: date }
        end: { type: string, format: date }
        total_mm: { type: number, minimum: 0 }
        peak_day_mm: { type: number, minimum: 0 }
        antecedent_wetness:
          type: number
          minimum: 0
          maximum: 1
          description: Mean root-zone soil wetness over the prior days (0–1 fraction, NASA POWER). TODO(verify) parameter.
        hyetograph:
          type: object
          required: [step_minutes, mm, synthetic, profile]
          properties:
            step_minutes: { type: integer, minimum: 1 }
            mm:
              type: array
              description: Rainfall per step, millimeters.
              items: { type: number, minimum: 0 }
            synthetic: { type: boolean, description: True when daily totals were spread over hours with an assumed profile. }
            profile: { type: string, examples: [design_storm_assumed] }
        weather_source:
          type: object
          required: [name, resolution_km, basis]
          properties:
            name: { type: string, examples: [NASA POWER] }
            resolution_km: { type: number, exclusiveMinimum: 0 }
            basis: { $ref: '#/components/schemas/Basis' }
        rank: { type: integer, minimum: 1, description: 'Rank among distinct storms by 1–3 day total, 1981 to present.' }
        rank_of: { type: integer, minimum: 1 }
        named_event: { type: [string, 'null'], description: TODO(verify) dates. }

    # ---------- Crops & rotations ----------
    CropTemplate:
      type: object
      required: [id, name, family, n_fixing, season_window, cover_curve, notes, source]
      properties:
        id: { $ref: '#/components/schemas/CropId' }
        name: { type: string }
        family: { type: string, examples: [Poaceae] }
        n_fixing: { type: boolean }
        season_window:
          type: object
          description: Day-of-year window; `terminate_doy < plant_doy` means it overwinters. Null means the day is not verified.
          required: [plant_doy, terminate_doy]
          properties:
            plant_doy:
              oneOf:
                - { type: integer, minimum: 1, maximum: 366 }
                - { type: 'null' }
            terminate_doy:
              oneOf:
                - { type: integer, minimum: 1, maximum: 366 }
                - { type: 'null' }
            succession: { type: boolean, description: 'v1.2. Vegetables may be sown in succession inside the window.' }
        cover_curve:
          type: array
          description: '`[days_after_planting, cover_fraction]` points, ascending by day; fraction 0–1. Empty means no curve has been sourced.'
          items:
            type: array
            prefixItems:
              - { type: integer, minimum: 0 }
              - { type: number, minimum: 0, maximum: 1 }
            minItems: 2
            maxItems: 2
          minItems: 0
        notes: { type: string }
        source: { type: string, description: 'Reference for parameter values, or `to_verify`.' }
    RotationStep:
      type: object
      required: [year, crop_id]
      properties:
        year: { type: integer, minimum: 1 }
        crop_id: { $ref: '#/components/schemas/CropId' }
    CoverCalendar:
      type: object
      required: [days_bare_per_year, monthly_cover]
      properties:
        days_bare_per_year:
          type: array
          description: One value per rotation year.
          items: { type: number, minimum: 0, maximum: 366 }
        monthly_cover:
          type: array
          description: One row per rotation year; each row has 12 monthly cover fractions (Jan–Dec, 0–1).
          items:
            type: array
            items: { type: number, minimum: 0, maximum: 1 }
            minItems: 12
            maxItems: 12
    Rotation:
      type: object
      required: [id, name, is_existing, sequence, cover_calendar]
      properties:
        id: { $ref: '#/components/schemas/RotationId' }
        name: { type: string }
        is_existing: { type: boolean }
        sequence:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RotationStep' }
        cover_calendar: { $ref: '#/components/schemas/CoverCalendar' }
    ValidateRequest:
      type: object
      required: [terrain_id, rotation]
      properties:
        terrain_id:
          $ref: '#/components/schemas/TerrainId'
          description: Used for the location's season-window check.
        rotation:
          type: object
          required: [name, sequence]
          properties:
            base_rotation_id:
              $ref: '#/components/schemas/RotationId'
              description: Preset the user edited, if any.
            name: { type: string }
            sequence:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RotationStep' }
    ValidationWarning:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [same_family_consecutive, outside_season_window, unknown_crop] }
        message: { type: string }
        year: { type: integer, minimum: 1, description: Rotation year the warning applies to. }
    ValidateResult:
      type: object
      required: [valid, warnings]
      properties:
        valid: { type: boolean, description: False only for blocking problems (e.g. `unknown_crop`). }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/ValidationWarning' }
        rotation:
          $ref: '#/components/schemas/Rotation'
          description: |
            Present when `valid`. The edited rotation with a stable content-hash ID
            (`rot_custom_…`) and computed cover calendar, usable in `SimulationRequest.rotation_ids`.

    # ---------- Simulation ----------
    SimulationOptions:
      type: object
      properties:
        grid_max: { type: integer, minimum: 16, default: 256 }
        frames: { type: integer, minimum: 1, default: 60 }
        soil_group: { type: string, enum: [A, B, C, D], default: B, description: Hydrologic soil group. }
        soil_group_basis: { $ref: '#/components/schemas/Basis', default: assumed }
    SimulationRequest:
      type: object
      required: [terrain_id, storm_id, rotation_ids]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        storm_id: { $ref: '#/components/schemas/StormId' }
        rotation_ids:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { $ref: '#/components/schemas/RotationId' }
        options: { $ref: '#/components/schemas/SimulationOptions' }
        scenario: { $ref: '#/components/schemas/Scenario' }
    JobStatus:
      type: string
      enum: [queued, running, done, failed]
    RotationResult:
      type: object
      required: [frames, risk, metrics, step_minutes, frame_times_min]
      properties:
        frames: { type: string, description: URL path to the FTW1 frame file. }
        risk: { type: string, description: URL path to the risk PNG. }
        metrics: { $ref: '#/components/schemas/Metrics' }
        step_minutes: { type: number, exclusiveMinimum: 0, description: Minutes between frames. }
        frame_times_min:
          type: array
          description: Time of each frame, minutes from storm start. Length = frame_count.
          items: { type: number, minimum: 0 }
    SimulationStatus:
      type: object
      required: [id, status, progress, cached, results]
      properties:
        id: { $ref: '#/components/schemas/SimulationId' }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: number, minimum: 0, maximum: 1, description: Fraction complete (0–1). }
        cached: { type: boolean }
        results:
          type: object
          description: Keyed by rotation ID. Only rotations that are fully done appear; empty until then.
          propertyNames: { $ref: '#/components/schemas/RotationId' }
          additionalProperties: { $ref: '#/components/schemas/RotationResult' }
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Present when `status` is `failed`.

    Metrics:
      type: object
      description: Per rotation, per storm. Relative comparisons, not predictions.
      required: [runoff_volume_m3, runoff_depth_mm_mean, ponded_area_ha, ponded_peak_depth_cm, erosion_index_mean, erosion_high_share_pct, bare_days_per_year, basis]
      properties:
        runoff_volume_m3: { type: number, minimum: 0 }
        runoff_depth_mm_mean: { type: number, minimum: 0 }
        ponded_area_ha: { type: number, minimum: 0 }
        ponded_peak_depth_cm: { type: number, minimum: 0 }
        erosion_index_mean: { type: number, minimum: 0, maximum: 100, description: Relative index 0–100. }
        erosion_high_share_pct: { type: number, minimum: 0, maximum: 100 }
        bare_days_per_year: { type: number, minimum: 0, maximum: 366 }
        basis:
          type: object
          required: [runoff, ponding, erosion_index]
          properties:
            runoff: { $ref: '#/components/schemas/BasisOrRelative' }
            ponding: { $ref: '#/components/schemas/BasisOrRelative' }
            erosion_index: { $ref: '#/components/schemas/BasisOrRelative' }

    DiffStats:
      type: object
      required: [a, b, quantity, unit, max_abs_diff_mm, mean_diff_mm, changed_area_ha, basis]
      properties:
        a: { $ref: '#/components/schemas/RotationId' }
        b: { $ref: '#/components/schemas/RotationId' }
        quantity: { type: string, const: peak_water_depth }
        unit: { type: string, const: mm }
        max_abs_diff_mm: { type: number, minimum: 0, description: Scale used to encode the diff PNG. }
        mean_diff_mm: { type: number, description: Mean of `b − a` over unmasked cells. }
        changed_area_ha: { type: number, minimum: 0, description: Area where `|b − a|` exceeds 1 mm. }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }

    # ---------- Insights & evidence ----------
    Insight:
      type: object
      required: [id, kind, title, body, why_it_matters, tip, confidence, anchor, data_refs, severity]
      properties:
        id: { $ref: '#/components/schemas/InsightId' }
        kind:
          type: string
          description: Clients render unknown values neutrally.
          enum: [terrain, cover, storm, rotation, data_quality, opportunity, protected, winter_wet, summer_dry]
        title: { type: string }
        body: { type: string }
        why_it_matters: { type: string }
        tip: { type: string }
        confidence: { type: string, enum: [low, medium, high] }
        anchor:
          type: object
          required: [lon, lat, at_time_min]
          properties:
            lon: { type: number, minimum: -180, maximum: 180 }
            lat: { type: number, minimum: -90, maximum: 90 }
            at_time_min:
              type: [number, 'null']
              minimum: 0
              description: Minutes from storm start for timed insights; null otherwise.
        data_refs:
          type: array
          items: { type: string, examples: [layers.slope] }
        severity: { type: integer, minimum: 1, maximum: 5, description: '1 = lowest, 5 = highest.' }
        action: { type: string, description: One sentence (v1.1). }
        zone_ids: { type: array, items: { type: string } }
        active_weeks: { type: array, items: { type: integer, minimum: 0, maximum: 51 }, description: 'Weeks 0–51, wraps.' }
        scenario: { $ref: '#/components/schemas/Scenario' }
    EvidenceCard:
      type: object
      required: [rotation_id, why_suggested, evidence, benefits, information_gaps, risks_for_local_review, support_not_replace]
      properties:
        rotation_id: { $ref: '#/components/schemas/RotationId' }
        why_suggested: { type: string }
        evidence: { type: array, items: { type: string } }
        evidence_items:
          type: array
          description: Structured evidence with value, unit, basis and source (v1.1). `evidence` keeps the plain-text lines.
          items: { $ref: '#/components/schemas/EvidenceItem' }
        benefits: { type: array, items: { type: string } }
        information_gaps: { type: array, items: { type: string } }
        risks_for_local_review: { type: array, items: { type: string } }
        support_not_replace:
          type: string
          const: This tool supports, and does not replace, local agronomic expertise.
    EvidenceBundle:
      type: object
      required: [evidence_cards, insights]
      properties:
        evidence_cards:
          type: array
          items: { $ref: '#/components/schemas/EvidenceCard' }
        insights:
          type: array
          items: { $ref: '#/components/schemas/Insight' }

    # ---------- Scans ----------
    ScanCreateForm:
      type: object
      required: [lat, lon]
      properties:
        images:
          type: array
          description: |
            0–6 photos (JPEG, PNG, WEBP), sent as repeated `images` parts. Optional: with none,
            the back-end uses an open-imagery fallback texture.
          maxItems: 6
          items: { type: string, contentMediaType: application/octet-stream }
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
        bbox:
          type: string
          description: Optional `minLon,minLat,maxLon,maxLat` (comma-separated WGS84). Default is a server-chosen square around `lat`/`lon`.
          pattern: '^-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?,-?\d+(\.\d+)?$'
        name: { type: string, maxLength: 120 }
    ScanCreated:
      type: object
      required: [scan_id]
      properties:
        scan_id: { $ref: '#/components/schemas/ScanId' }
    ProgressStage:
      type: string
      description: In pipeline order.
      enum:
        - queued
        - reading_inputs
        - locating
        - fetching_elevation
        - building_mesh
        - classifying_cover
        - analyzing_drainage
        - fetching_weather
        - packaging
        - ready
        - failed
    ScanStatus:
      type: object
      required: [status, stage, pct]
      properties:
        status: { $ref: '#/components/schemas/JobStatus' }
        stage: { $ref: '#/components/schemas/ProgressStage' }
        pct: { type: number, minimum: 0, maximum: 100 }
        terrain_id:
          $ref: '#/components/schemas/TerrainId'
          description: Present when `status` is `done`.
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Present when `status` is `failed`.
    ProgressEvent:
      type: object
      description: JSON `data` of an SSE `progress` event.
      required: [scan_id, stage, pct, message, ts]
      properties:
        scan_id: { $ref: '#/components/schemas/ScanId' }
        stage: { $ref: '#/components/schemas/ProgressStage' }
        pct: { type: number, minimum: 0, maximum: 100 }
        message: { type: string }
        ts: { $ref: '#/components/schemas/Timestamp' }
        terrain_id:
          $ref: '#/components/schemas/TerrainId'
          description: Present on the `ready` event.
        error:
          $ref: '#/components/schemas/ErrorBody'
          description: Present on the `failed` event.

    # ---------- Layers, provenance, weather ----------
    LayerLegend:
      type: object
      required: [name, title, kind, unit, value_range, color_ramp, nodata_value, url, basis]
      properties:
        name: { $ref: '#/components/schemas/LayerName' }
        title: { type: string }
        kind: { type: string, enum: [continuous, categorical] }
        unit: { type: string, description: 'e.g. `degrees`, `cells`, `m`; empty string for categorical.' }
        value_range:
          type: array
          description: |
            Physical `[min, max]`. For continuous layers, `value = min + byte / 254 * (max − min)`
            for bytes 0–254. For categorical layers, the class index range.
          items: { type: number }
          minItems: 2
          maxItems: 2
        color_ramp: { type: string, description: 'Rendering hint, e.g. `viridis`, `blues`, `categorical`.' }
        nodata_value: { type: integer, const: 255 }
        classes:
          type: array
          description: Categorical layers only.
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: integer, minimum: 0, maximum: 254 }
              label: { type: string }
              color: { type: string, description: 'Hex color hint, e.g. `#4caf50`.' }
        url: { type: string, description: URL path to the layer PNG. }
        basis: { $ref: '#/components/schemas/Basis' }
    LayerCatalog:
      type: object
      required: [terrain_id, layers]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        layers:
          type: array
          items: { $ref: '#/components/schemas/LayerLegend' }
    ProvenanceDataset:
      allOf:
        - $ref: '#/components/schemas/Source'
        - type: object
          properties:
            attribution: { type: string }
            date_range:
              type: object
              required: [start, end]
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
    Assumption:
      type: object
      required: [statement, basis]
      properties:
        statement: { type: string, examples: [Soil hydrologic group B assumed everywhere.] }
        basis: { $ref: '#/components/schemas/Basis' }
    Provenance:
      type: object
      required: [terrain_id, datasets, quality_flags, assumptions, limitations]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        datasets:
          type: array
          items: { $ref: '#/components/schemas/ProvenanceDataset' }
        texture: { $ref: '#/components/schemas/TextureInfo' }
        quality_flags:
          type: array
          items: { $ref: '#/components/schemas/QualityFlag' }
        assumptions:
          type: array
          items: { $ref: '#/components/schemas/Assumption' }
        limitations:
          type: array
          items: { type: string }
    TrendSeries:
      type: object
      required: [id, label, unit, points, trend, summary, basis]
      properties:
        id:
          type: string
          description: 'Known ids: `annual_precip_mm`, `heavy_rain_days`, `temp_mean_c`, `root_zone_wetness`.'
          examples: [annual_precip_mm]
        label: { type: string }
        unit: { type: string, examples: [mm, days, degC, fraction] }
        points:
          type: array
          items:
            type: object
            required: [year, value]
            properties:
              year: { type: integer }
              value: { type: number }
        trend:
          type: object
          required: [method, slope_per_decade, ci_low, ci_high, ci_level]
          properties:
            method: { type: string, const: theil_sen }
            slope_per_decade: { type: number, description: Series unit per decade. }
            ci_low: { type: number }
            ci_high: { type: number }
            ci_level: { type: number, exclusiveMinimum: 0, exclusiveMaximum: 1, examples: [0.95] }
        summary: { type: string, description: Plain-language sentence. }
        basis: { $ref: '#/components/schemas/Basis' }
    WeatherSummary:
      type: object
      required: [lat, lon, period, source, cached, series]
      properties:
        lat: { type: number }
        lon: { type: number }
        period:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        source:
          type: object
          required: [name, resolution_km, basis]
          properties:
            name: { type: string, examples: [NASA POWER] }
            resolution_km: { type: number, exclusiveMinimum: 0 }
            basis: { $ref: '#/components/schemas/Basis' }
        cached: { type: boolean, description: True when served from the on-disk cache after an upstream failure. }
        series:
          type: array
          items: { $ref: '#/components/schemas/TrendSeries' }
        climatology:
          type: object
          required: [weeks, rain_mm_median, rain_mm_p90, tmin_c_median, tmax_c_median, basis, years]
          properties:
            weeks: { type: integer, const: 52 }
            rain_mm_median: { $ref: '#/components/schemas/WeekValues' }
            rain_mm_p90: { $ref: '#/components/schemas/WeekValues' }
            tmin_c_median: { $ref: '#/components/schemas/WeekValues' }
            tmax_c_median: { $ref: '#/components/schemas/WeekValues' }
            growing_season:
              type: object
              properties:
                last_frost_doy_median: { type: [number, 'null'] }
                first_frost_doy_median: { type: [number, 'null'] }
                frost_free_days_median: { type: [number, 'null'] }
                gdd_base_c: { type: number, description: Assumed base temperature. }
                gdd_median: { type: number }
            basis: { $ref: '#/components/schemas/Basis' }
            years:
              type: object
              required: [start, end]
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }

    # ---------- Notes ----------
    NoteCreate:
      type: object
      required: [terrain_id, anchor, body]
      properties:
        terrain_id: { $ref: '#/components/schemas/TerrainId' }
        anchor: { $ref: '#/components/schemas/LonLat' }
        body: { type: string, minLength: 1, maxLength: 2000 }
        parent_id:
          $ref: '#/components/schemas/NoteId'
          description: Set for replies in a thread.
        author: { type: string, maxLength: 80, description: Display name; no accounts. }
    Note:
      allOf:
        - $ref: '#/components/schemas/NoteCreate'
        - type: object
          required: [id, created_at]
          properties:
            id: { $ref: '#/components/schemas/NoteId' }
            created_at: { $ref: '#/components/schemas/Timestamp' }

    # ---------- v1.1: features, hazards, zones (Backend A) ----------
    Scenario:
      type: string
      enum: [baseline, wetter_winters, drier_summers, both]
      default: baseline
      description: Preset that reweights observed years. Modeled scenario, not a forecast. Preset values are echoed in `ScenarioApplied`.
    ScenarioInput:
      type: object
      description: Preset plus optional custom values. Custom values override the preset. Allowed ranges are server config (assumed); outside them the API returns `SCENARIO_OUT_OF_RANGE`.
      properties:
        preset: { $ref: '#/components/schemas/Scenario' }
        rain_scale_pct: { type: number, description: 'Percent change applied to every daily rain value, e.g. -20.' }
        temp_offset_c: { type: number, description: Degrees Celsius added to every daily temperature. }
        rain_scale_by_season: { $ref: '#/components/schemas/SeasonalRainScale' }
    SeasonalRainScale:
      type: object
      description: 'Percent rain change per meteorological season (winter = Dec–Feb in the northern hemisphere, Jun–Aug in the southern). Overrides `rain_scale_pct` for that season.'
      properties:
        winter: { type: number }
        spring: { type: number }
        summer: { type: number }
        fall: { type: number }
    ScenarioApplied:
      type: object
      required: [preset, rain_scale_pct, temp_offset_c, label]
      properties:
        preset: { $ref: '#/components/schemas/Scenario' }
        rain_scale_pct: { type: number }
        temp_offset_c: { type: number }
        rain_scale_by_season: { $ref: '#/components/schemas/SeasonalRainScale' }
        label: { type: string, const: 'modeled scenario, not a forecast' }
        note: { type: string, const: built from observed years }
        ramp:
          $ref: '#/components/schemas/Ramp'
          description: 'v1.2. Present on forecast responses. Slider values are reached at the end of the ramp.'
    DataMode:
      type: string
      enum: [live, cached, seed, mock, limited_data]
      description: |
        Where the data came from. `mock` must never appear in the demo build.
        `limited_data` means a real run is missing a layer (for example no satellite seed);
        the missing layer is null or absent, never filled with invented values.
    Confidence:
      type: string
      enum: [high, medium, low]
    WeekValues:
      type: array
      description: One value per week, index 0–51 (7-day blocks from 1 January; days 358–366 fold into index 51). `null` = missing.
      minItems: 52
      maxItems: 52
      items: { type: [number, 'null'] }
    FeatureSeries:
      type: object
      required: [unit, basis, mean, std, median, p10, p90, by_year]
      properties:
        unit: { type: string, examples: [mm, degC, sigma, fraction] }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
        description: { type: string }
        mean: { $ref: '#/components/schemas/WeekValues' }
        std: { $ref: '#/components/schemas/WeekValues' }
        median: { $ref: '#/components/schemas/WeekValues' }
        p10: { $ref: '#/components/schemas/WeekValues' }
        p90: { $ref: '#/components/schemas/WeekValues' }
        by_year:
          type: object
          description: 'Year (e.g. `"1991"`) to 52 weekly values. Probability features (`*_prob`) hold 0/1 event flags per year.'
          additionalProperties: { $ref: '#/components/schemas/WeekValues' }
        interpolated: { type: boolean, description: True when a coarser series was linearly interpolated to weekly. }
    FeatureThresholds:
      type: object
      description: Every threshold is assumed (stated so reviewers can change it) except `extreme_rain_mm` and `wet_ground_value`, which are derived from the site's own baseline history.
      required: [frost_c, heat_c, extreme_rain_percentile, extreme_rain_mm, wet_day_mm, dry_day_mm, dry_spell_days, wet_ground_percentile, wet_ground_value, vulnerable_prob]
      properties:
        frost_c: { type: number }
        heat_c: { type: number }
        extreme_rain_percentile: { type: number }
        extreme_rain_mm: { type: number }
        wet_day_mm: { type: number }
        dry_day_mm: { type: number }
        dry_spell_days: { type: integer }
        wet_ground_percentile: { type: number }
        wet_ground_value: { type: number, description: Top-soil wetness (0–1) at that percentile. }
        vulnerable_prob: { type: number }
    SourceUsed:
      type: object
      required: [name, resolution_note]
      properties:
        name: { type: string }
        resolution_note: { type: string }
    DataQuality:
      type: object
      required: [years_available, missing_fraction, sources_used, sources_agree, resolution_note, interpolated_series, limited_data]
      properties:
        years_available: { type: integer, minimum: 0 }
        missing_fraction:
          type: object
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        sources_used:
          type: array
          items: { $ref: '#/components/schemas/SourceUsed' }
        sources_agree:
          type: [boolean, 'null']
          description: POWER wetness vs SMAP anomaly signs match in at least the stated share of weeks; null when no SMAP seed.
        resolution_note: { type: string }
        interpolated_series: { type: array, items: { type: string } }
        limited_data: { type: boolean, description: True when no seeded satellite or soil data is available. }
    SoilSummary:
      type: object
      required: [texture_class, infiltration_class, basis, source]
      properties:
        clay_pct: { type: number }
        sand_pct: { type: number }
        silt_pct: { type: number }
        soc_g_per_kg: { type: number }
        ph: { type: number }
        depth: { type: string, examples: [0-30cm] }
        texture_class: { type: string, examples: [loam] }
        infiltration_class: { type: string, enum: [high, medium, low] }
        basis: { $ref: '#/components/schemas/Basis' }
        source: { type: string }
    FeatureTable:
      type: object
      required: [schema_version, pipeline_version, site_id, location, years, weeks, scenario, data_mode, features, thresholds, soil, quality, sources, caveats]
      properties:
        schema_version: { type: string, const: 1.1.0 }
        pipeline_version: { type: string }
        site_id: { $ref: '#/components/schemas/SiteId' }
        location: { $ref: '#/components/schemas/LonLat' }
        years:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        weeks: { type: integer, const: 52 }
        scenario: { $ref: '#/components/schemas/ScenarioApplied' }
        data_mode: { $ref: '#/components/schemas/DataMode' }
        features:
          type: object
          description: 'Feature id to series. Ids: rain_mm, rain_max_day_mm, tmean_c, tmax_c, tmin_c, soil_wetness_root, soil_wetness_top, soil_moisture_anomaly, et0_mm, water_balance_mm, frost_prob, heat_prob, extreme_rain_prob, dry_spell_prob; plus ndvi, ndvi_anomaly, smap_anomaly where seeded.'
          additionalProperties: { $ref: '#/components/schemas/FeatureSeries' }
        thresholds: { $ref: '#/components/schemas/FeatureThresholds' }
        soil:
          oneOf:
            - $ref: '#/components/schemas/SoilSummary'
            - type: 'null'
        quality: { $ref: '#/components/schemas/DataQuality' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        caveats: { type: array, items: { type: string } }

    HazardCalendar:
      type: object
      required: [site_id, scenario, years, j_wet, j_dry, thresholds, basis, sources]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        scenario: { $ref: '#/components/schemas/Scenario' }
        scenario_applied: { $ref: '#/components/schemas/ScenarioApplied' }
        data_mode: { $ref: '#/components/schemas/DataMode' }
        years:
          type: object
          required: [start, end]
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        j_wet:
          allOf: [{ $ref: '#/components/schemas/WeekValues' }]
          description: 0–1, share of years with heavy rain on wet ground in that week.
        j_dry:
          allOf: [{ $ref: '#/components/schemas/WeekValues' }]
          description: 0–1, share of years in a dry spell in that week.
        thresholds:
          type: object
          required: [q_rain, q_wet, n_dry_days, q_dry]
          properties:
            q_rain: { type: number, description: 'Heavy-rain day threshold, mm (derived percentile).' }
            q_wet: { type: number, description: 'Wet-ground threshold, top-soil wetness 0–1 (derived percentile).' }
            n_dry_days: { type: integer, description: Consecutive dry days that make a dry spell (assumed). }
            q_dry: { type: number, description: A day below this rain (mm) counts as dry (assumed). }
        basis: { $ref: '#/components/schemas/Basis' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        caveats: { type: array, items: { type: string } }
    HazardKind:
      type: string
      enum: [heavy_rain_wet_ground, multi_day_heavy_rain, dry_spell, heat_spell, late_frost]
    HazardType:
      type: object
      required: [id, kind, label, years_with_event, years_total, peak_weeks, basis, sources]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/HazardKind' }
        label: { type: string }
        definition: { type: string, description: Plain-language rule with its thresholds. }
        years_with_event: { type: integer, minimum: 0 }
        years_total: { type: integer, minimum: 0 }
        peak_weeks:
          type: array
          items: { type: integer, minimum: 0, maximum: 51 }
        worst_storm_id:
          oneOf:
            - $ref: '#/components/schemas/StormId'
            - type: 'null'
        basis: { $ref: '#/components/schemas/Basis' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
    HazardCatalog:
      type: object
      required: [site_id, items]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        data_mode: { $ref: '#/components/schemas/DataMode' }
        items:
          type: array
          items: { $ref: '#/components/schemas/HazardType' }

    GeoJsonPolygon:
      type: object
      required: [type, coordinates]
      properties:
        type: { type: string, const: Polygon }
        coordinates:
          type: array
          items:
            type: array
            items: { $ref: '#/components/schemas/LonLat' }
    ZoneKind:
      type: string
      enum: [erosion_risk, water_stress, frost_pocket]
    Zone:
      type: object
      required: [id, outline, icon_point, area_ha, terrain_factor, basis]
      properties:
        id: { type: string }
        kind: { $ref: '#/components/schemas/ZoneKind' }
        label: { type: string, description: Plain language. }
        note: { type: string, examples: ['Derived from terrain and soil data, not field-measured.'] }
        outline: { $ref: '#/components/schemas/GeoJsonPolygon' }
        icon_point: { $ref: '#/components/schemas/LonLat' }
        area_ha: { type: number, minimum: 0 }
        terrain_factor: { type: number, description: 'Relative, field mean = 1.' }
        field_id: { type: [string, 'null'] }
        crop: { type: [string, 'null'] }
        winter_exposure: { type: [number, 'null'], description: Relative. }
        summer_exposure: { type: [number, 'null'], description: Relative. }
        resolution_note: { type: string, description: 'Set when the layer is coarser than the field (v1.2). One farm-level zone, not fake sub-pixels.' }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
    ZoneCollection:
      type: object
      required: [site_id, zones]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        terrain_id:
          oneOf:
            - $ref: '#/components/schemas/TerrainId'
            - type: 'null'
        data_mode: { $ref: '#/components/schemas/DataMode' }
        zones:
          type: array
          items: { $ref: '#/components/schemas/Zone' }
        caveats: { type: array, items: { type: string } }

    # ---------- v1.1: rotation analysis (schemas only; Backend B fills these) ----------
    Exposure:
      type: object
      required: [value, p10, p90]
      properties:
        value: { type: number }
        p10: { type: number }
        p90: { type: number }
        basis: { type: string, const: relative }
    RotationComparison:
      type: object
      required: [site_id, scenario, rotations]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        scenario: { $ref: '#/components/schemas/Scenario' }
        rotations:
          type: array
          items:
            type: object
            required: [rotation_id, winter, summer, rank_stability, basis]
            properties:
              rotation_id: { $ref: '#/components/schemas/RotationId' }
              winter: { $ref: '#/components/schemas/Exposure' }
              summer: { $ref: '#/components/schemas/Exposure' }
              rank_stability: { type: [string, 'null'] }
              basis: { type: string, const: relative }
    Criterion:
      type: string
      enum: [nutrient_cycling, erosion_risk, organic_matter, pest_disruption, water_use, forage_potential, market_suitability]
    Season:
      type: string
      enum: [spring, summer, fall, winter]
    RotationSlot:
      type: object
      required: [year_index, season, crop_id]
      properties:
        year_index: { type: integer, minimum: 1 }
        season: { $ref: '#/components/schemas/Season' }
        crop_id:
          oneOf:
            - $ref: '#/components/schemas/CropId'
            - { type: string, const: fallow }
    FarmerPriorities:
      type: object
      properties:
        criteria_selected:
          type: array
          description: Empty or missing means all seven.
          uniqueItems: true
          items: { $ref: '#/components/schemas/Criterion' }
        weights:
          type: object
          description: 'Criterion to weight (>= 0). Normalized to sum 1; all zero gives `INVALID_WEIGHTS`.'
          propertyNames: { $ref: '#/components/schemas/Criterion' }
          additionalProperties: { type: number, minimum: 0 }
        weight_preset: { type: string, enum: [water, income, soil_structure, erosion, forage] }
        constraints:
          type: object
          properties:
            low_water: { type: boolean }
            no_specialty_equipment: { type: boolean }
            no_local_market: { type: boolean }
    RotationAnalysisRequest:
      allOf:
        - $ref: '#/components/schemas/FarmerPriorities'
        - type: object
          properties:
            existing_rotation:
              oneOf:
                - { type: string, const: preset }
                - type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/RotationSlot' }
            allowed_crops:
              type: array
              items: { $ref: '#/components/schemas/CropId' }
            scenario:
              oneOf:
                - $ref: '#/components/schemas/Scenario'
                - $ref: '#/components/schemas/ScenarioInput'
            location: { $ref: '#/components/schemas/LonLat' }
    ScoreInput:
      type: object
      required: [name, value, unit, basis]
      properties:
        name: { type: string }
        value: { type: [number, string, boolean] }
        unit: { type: string }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
    RotationScorecard:
      type: object
      required: [criterion, score, unit, basis, confidence, needs_local_review, inputs]
      properties:
        criterion: { $ref: '#/components/schemas/Criterion' }
        score: { type: number, minimum: 0, maximum: 100, description: 'Relative index across the three rotations; higher is better.' }
        unit: { type: string }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
        range:
          type: object
          description: Only on climate-driven criteria (water use, erosion risk).
          required: [p10, p90]
          properties:
            p10: { type: number }
            p90: { type: number }
        confidence: { $ref: '#/components/schemas/Confidence' }
        needs_local_review: { type: boolean }
        note: { type: string }
        year10_value: { type: number, description: 'v1.2. Year-10 value of the underlying metric, same unit and basis as this row.' }
        mean_value: { type: number, description: 'v1.2. Mean of years 1–10 of the underlying metric, same unit and basis as this row.' }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/ScoreInput' }
    EvidenceItem:
      type: object
      required: [label, value, unit, basis, source]
      properties:
        label: { type: string }
        value: { type: [number, string] }
        unit: { type: string }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
        source: { type: string }
    VulnerableSeason:
      type: object
      required: [weeks, hazards]
      properties:
        weeks:
          type: array
          items: { type: integer, minimum: 0, maximum: 51 }
        hazards:
          type: array
          items: { type: string, enum: [frost_prob, heat_prob, dry_spell_prob, extreme_rain_prob] }
    AnalyzedRotation:
      type: object
      required: [rotation_id, is_existing, sequence, cover_calendar, scorecard, overall, rank, rank_stability, exposure, evidence_card]
      properties:
        rotation_id: { $ref: '#/components/schemas/RotationId' }
        name: { type: string }
        is_existing: { type: boolean }
        sequence:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RotationSlot' }
        cover_calendar: { $ref: '#/components/schemas/CoverCalendar' }
        scorecard:
          type: array
          items: { $ref: '#/components/schemas/RotationScorecard' }
        overall: { type: number, minimum: 0, maximum: 100 }
        rank: { type: integer, minimum: 1, maximum: 3 }
        rank_stability: { type: [string, 'null'] }
        exposure:
          type: object
          required: [winter, summer]
          properties:
            winter: { $ref: '#/components/schemas/Exposure' }
            summer: { $ref: '#/components/schemas/Exposure' }
        vulnerable_seasons:
          type: array
          items: { $ref: '#/components/schemas/VulnerableSeason' }
        evidence_card: { $ref: '#/components/schemas/EvidenceCard' }
    AnalysisWarning:
      type: object
      required: [code, level, message]
      properties:
        code: { type: string, examples: [NO_FEASIBLE_ALTERNATIVES, IGNORED_WEIGHT] }
        level: { type: string, enum: [info, warning, error] }
        message: { type: string }
    RotationAnalysis:
      type: object
      required: [site_id, engine_version, request_hash, request_echo, scenario, data_mode, limited_data, confidence, rotations, weights_applied, warnings, disclaimer]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        engine_version: { type: string }
        request_hash: { type: string }
        request_echo: { $ref: '#/components/schemas/RotationAnalysisRequest' }
        scenario: { $ref: '#/components/schemas/ScenarioApplied' }
        data_mode: { $ref: '#/components/schemas/DataMode' }
        limited_data: { type: boolean }
        confidence: { $ref: '#/components/schemas/Confidence' }
        rotations:
          type: array
          minItems: 1
          maxItems: 3
          description: Existing rotation first. Fewer than three only with a `NO_FEASIBLE_ALTERNATIVES` warning.
          items: { $ref: '#/components/schemas/AnalyzedRotation' }
        weights_applied:
          type: object
          propertyNames: { $ref: '#/components/schemas/Criterion' }
          additionalProperties: { type: number, minimum: 0, maximum: 1 }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AnalysisWarning' }
        disclaimer: { type: string, const: 'This tool supports, and does not replace, local agronomic expertise.' }
    CropTrait:
      allOf:
        - $ref: '#/components/schemas/CropTemplate'
        - type: object
          description: Trait fields (v1.1). All are typical crop traits, not measured on a field.
          properties:
            water_need_class:
              oneOf:
                - { type: string, enum: [low, medium, high] }
                - { type: 'null' }
            kc_stages:
              type: object
              description: Null stage means that Table 12 value was not transcribed.
              properties:
                ini:
                  oneOf:
                    - { type: number }
                    - { type: 'null' }
                mid:
                  oneOf:
                    - { type: number }
                    - { type: 'null' }
                end:
                  oneOf:
                    - { type: number }
                    - { type: 'null' }
            root_depth_class:
              oneOf:
                - { type: string, enum: [shallow, medium, deep] }
                - { type: 'null' }
            cover_crop: { type: boolean }
            perennial: { type: boolean }
            drought_tolerance:
              oneOf:
                - { type: string, enum: [low, medium, high] }
                - { type: 'null' }
            frost_tolerance_c:
              oneOf:
                - { type: number }
                - { type: 'null' }
            heat_limit_c:
              oneOf:
                - { type: number }
                - { type: 'null' }
            residue_class:
              oneOf:
                - { type: string, enum: [low, medium, high] }
                - { type: 'null' }
            forage_suitable: { type: boolean }
            market_rating: { type: string, enum: [high, medium, low] }
            market_dependent: { type: boolean }
            needs_specialty_equipment: { type: boolean }
            trait_sources:
              type: object
              description: 'Field name to source, or `TODO(verify)`.'
              additionalProperties: { type: string }
    GlossaryEntry:
      type: object
      required: [id, kind, term, short, long, source]
      properties:
        id: { type: string }
        kind: { type: string, enum: [term, crop_type] }
        term: { type: string }
        short: { type: string }
        long: { type: string }
        how_we_use_it: { type: string }
        why_it_helps: { type: string }
        limits: { type: string }
        related_terms: { type: array, items: { type: string } }
        source: { type: string, description: 'Reference, or `TODO(verify)`.' }

    # ---------- v1.2: forecast (docs/backend-forecast-prd.md §6) ----------
    # Component name ForecastExposure is used because v1.1 already defines Exposure.
    Ramp:
      type: object
      description: 'Slider and preset values are phased in from year 0. Only linear is specified (PRD §5.7). Basis is assumed.'
      required: [shape, years, basis]
      properties:
        shape: { type: string, const: linear }
        years: { type: integer, minimum: 5, maximum: 10 }
        basis: { type: string, const: assumed }
    Number:
      type: object
      description: Every reported quantity. Absolute estimates also set p10, p50 and p90.
      required: [value, unit, basis, confidence]
      properties:
        value: { type: number }
        unit: { type: string, minLength: 1 }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        p10: { type: number }
        p50: { type: number }
        p90: { type: number }
    YearPoint:
      type: object
      required: [year, p50]
      properties:
        year: { type: integer, minimum: 0, maximum: 10, description: '0 is the baseline.' }
        p50: { type: number }
        p10: { type: number }
        p90: { type: number }
    YearSeries:
      type: object
      required: [metric, unit, basis, confidence, needs_local_review, points]
      properties:
        metric: { type: string, minLength: 1 }
        unit: { type: string, minLength: 1 }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        needs_local_review: { type: boolean }
        points:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/YearPoint' }
    AbsoluteYearSeries:
      description: Year series whose every point has a p10/p90 range (yield, forage, fertilizer, soil loss, and other ranged counts).
      allOf:
        - $ref: '#/components/schemas/YearSeries'
        - type: object
          properties:
            points:
              type: array
              minItems: 1
              items:
                type: object
                required: [year, p50, p10, p90]
    Trend:
      type: object
      description: 'Observed Theil-Sen slope with a Mann-Kendall p-value. Reported as context, not extrapolated (PRD §5.3).'
      required: [slope, mk_p_value, significant]
      properties:
        slope: { $ref: '#/components/schemas/Number', description: 'Unit is on the number. Temperature trends use degC/year.' }
        mk_p_value: { $ref: '#/components/schemas/Number', description: 'Dimensionless. Unit is 1.' }
        significant: { type: boolean, description: 'True when mk_p_value is below the stated significance_alpha.' }
    BaselineScenario:
      type: object
      required: [baseline, scenario]
      properties:
        baseline: { $ref: '#/components/schemas/Number' }
        scenario: { $ref: '#/components/schemas/Number' }
    SeasonTemperature:
      type: object
      required: [observed, scenario_mean]
      properties:
        observed: { $ref: '#/components/schemas/Trend' }
        scenario_mean: { $ref: '#/components/schemas/Number' }
    SeasonalTemperature:
      type: object
      required: [significance_alpha, winter, spring, summer, fall]
      properties:
        significance_alpha: { $ref: '#/components/schemas/Number', description: 'Threshold for significant. Basis assumed until a source is cited.' }
        winter: { $ref: '#/components/schemas/SeasonTemperature' }
        spring: { $ref: '#/components/schemas/SeasonTemperature' }
        summer: { $ref: '#/components/schemas/SeasonTemperature' }
        fall: { $ref: '#/components/schemas/SeasonTemperature' }
    HeatStressCrop:
      type: object
      required: [crop_id, heat_limit_c, days]
      properties:
        crop_id: { $ref: '#/components/schemas/CropId' }
        heat_limit_c: { $ref: '#/components/schemas/Number' }
        days: { $ref: '#/components/schemas/AbsoluteYearSeries', description: 'Days per year above the crop heat limit, years 1–10, central and p10/p90.' }
    FrostDate:
      type: object
      description: 'Day of year, 1 = 1 January. Median is value and p50; p10 and p90 are the baseline spread.'
      required: [baseline_doy, scenario_shift_days]
      properties:
        baseline_doy: { $ref: '#/components/schemas/Number' }
        scenario_shift_days: { $ref: '#/components/schemas/Number', description: 'Days. Positive means later than the baseline.' }
    RainfallOutlook:
      type: object
      required: [seasonal_totals, extreme_rain_days, multi_day_events]
      properties:
        seasonal_totals:
          type: object
          required: [winter, spring, summer, fall]
          properties:
            winter: { $ref: '#/components/schemas/BaselineScenario' }
            spring: { $ref: '#/components/schemas/BaselineScenario' }
            summer: { $ref: '#/components/schemas/BaselineScenario' }
            fall: { $ref: '#/components/schemas/BaselineScenario' }
        extreme_rain_days: { $ref: '#/components/schemas/BaselineScenario', description: 'Count of days at or above the wet-day p95.' }
        multi_day_events: { $ref: '#/components/schemas/BaselineScenario' }
    OptionalWeeklyLayer:
      type: object
      required: [available, resolution_note]
      properties:
        available: { type: boolean }
        resolution_note: { type: string }
        weekly:
          oneOf:
            - $ref: '#/components/schemas/WeekValues'
            - type: 'null'
    OptionalNumberLayer:
      type: object
      required: [available, resolution_note]
      properties:
        available: { type: boolean }
        resolution_note: { type: string }
        value:
          oneOf:
            - $ref: '#/components/schemas/Number'
            - type: 'null'
    EtAndSoilMoisture:
      type: object
      required: [et0_trend, smap_root_zone_anomaly, ecostress_et]
      properties:
        et0_trend: { $ref: '#/components/schemas/Trend' }
        smap_root_zone_anomaly: { $ref: '#/components/schemas/OptionalWeeklyLayer' }
        ecostress_et: { $ref: '#/components/schemas/OptionalNumberLayer' }
    WaterBalanceOutlook:
      type: object
      description: 'Surplus is positive, deficit is negative, millimetres. weekly_mm is the baseline climatology. Seasonal totals compare baseline and scenario.'
      required: [unit, basis, confidence, weekly_mm, seasonal]
      properties:
        unit: { type: string, const: mm }
        basis: { $ref: '#/components/schemas/BasisOrRelative' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        weekly_mm: { $ref: '#/components/schemas/WeekValues' }
        seasonal:
          type: object
          required: [winter, spring, summer, fall]
          properties:
            winter: { $ref: '#/components/schemas/BaselineScenario' }
            spring: { $ref: '#/components/schemas/BaselineScenario' }
            summer: { $ref: '#/components/schemas/BaselineScenario' }
            fall: { $ref: '#/components/schemas/BaselineScenario' }
    GroundwaterContext:
      type: object
      description: Regional context only. Never scored.
      required: [available, scored, resolution_note, trend]
      properties:
        available: { type: boolean }
        scored: { type: boolean, const: false }
        resolution_note: { type: string }
        trend:
          oneOf:
            - $ref: '#/components/schemas/Number'
            - type: 'null'
    ClimateOutlook:
      type: object
      required: [site_id, scenario, data_mode, seasonal_temperature, heat_stress_days, frost_windows, rainfall, et_and_soil_moisture, water_balance, groundwater, sources]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        scenario:
          allOf:
            - $ref: '#/components/schemas/ScenarioApplied'
            - type: object
              required: [ramp]
        data_mode: { $ref: '#/components/schemas/DataMode' }
        seasonal_temperature: { $ref: '#/components/schemas/SeasonalTemperature' }
        heat_stress_days:
          type: array
          items: { $ref: '#/components/schemas/HeatStressCrop' }
        frost_windows:
          type: object
          required: [last_spring_frost, first_fall_frost, frost_free_season_days]
          properties:
            last_spring_frost: { $ref: '#/components/schemas/FrostDate' }
            first_fall_frost: { $ref: '#/components/schemas/FrostDate' }
            frost_free_season_days: { $ref: '#/components/schemas/BaselineScenario' }
        rainfall: { $ref: '#/components/schemas/RainfallOutlook' }
        et_and_soil_moisture: { $ref: '#/components/schemas/EtAndSoilMoisture' }
        water_balance: { $ref: '#/components/schemas/WaterBalanceOutlook' }
        groundwater: { $ref: '#/components/schemas/GroundwaterContext' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
    ForecastHazard:
      type: string
      description: Hazard names in group 2. Distinct from the v1.1 probability ids on VulnerableSeason.
      enum: [heat, drought, frost, waterlogging]
    ForecastVulnerableSeason:
      type: object
      required: [crop_id, growth_stage, weeks, hazards]
      properties:
        crop_id: { $ref: '#/components/schemas/CropId' }
        growth_stage:
          type: string
          description: 'Known stage ids from crop kc_stages are ini, mid, end. Unknown strings are rendered neutrally.'
        weeks:
          type: array
          items: { type: integer, minimum: 0, maximum: 51 }
        hazards:
          type: array
          items: { $ref: '#/components/schemas/ForecastHazard' }
    BareFieldWindow:
      type: object
      required: [weeks, source]
      properties:
        weeks:
          type: array
          items: { type: integer, minimum: 0, maximum: 51 }
        source: { type: string, enum: [rotation_plan, ndvi], description: 'Planting records (rotation_plan) are primary. ndvi is a cross-check.' }
        scene_count: { type: [integer, 'null'], minimum: 0, description: 'Cloud-free scenes used, when source is ndvi.' }
        note: { type: string }
    ForecastExposure:
      type: object
      required: [site_id, vulnerable_seasons, bare_field_windows, zones, caveats]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        data_mode: { $ref: '#/components/schemas/DataMode' }
        crops:
          type: array
          items: { $ref: '#/components/schemas/CropId' }
        vulnerable_seasons:
          type: array
          items: { $ref: '#/components/schemas/ForecastVulnerableSeason' }
        bare_field_windows:
          type: array
          items: { $ref: '#/components/schemas/BareFieldWindow' }
        zones:
          type: array
          items: { $ref: '#/components/schemas/Zone' }
        resolution_notes:
          type: array
          items: { type: string }
        caveats:
          type: array
          items: { type: string }
    YieldCropSeries:
      type: object
      required: [crop_id, series]
      properties:
        crop_id: { $ref: '#/components/schemas/CropId' }
        series: { $ref: '#/components/schemas/AbsoluteYearSeries' }
    StrategyEstimates:
      type: object
      description: 'Absolute scenario estimates (decision D1). income_estimate is null when prices were not entered.'
      required: [yield_t_ha, forage_yield_t_ha, soil_loss_t_ha_yr, n_fertilizer_need_kg_ha, n_fertilizer_saved_kg_ha, income_estimate]
      properties:
        yield_t_ha:
          type: array
          items: { $ref: '#/components/schemas/YieldCropSeries' }
        forage_yield_t_ha: { $ref: '#/components/schemas/AbsoluteYearSeries' }
        soil_loss_t_ha_yr: { $ref: '#/components/schemas/AbsoluteYearSeries' }
        n_fertilizer_need_kg_ha: { $ref: '#/components/schemas/AbsoluteYearSeries' }
        n_fertilizer_saved_kg_ha: { $ref: '#/components/schemas/AbsoluteYearSeries' }
        income_estimate:
          description: Null, plus a review flag, when the farmer entered no prices. Currency is the unit.
          oneOf:
            - $ref: '#/components/schemas/Number'
            - type: 'null'
    Trajectories:
      type: object
      description: |
        Group 3. n_balance is the relative index (year 0 = 100). n_balance_kg_ha and n_fixed_share
        are the companion figures named in group 3 that do not fit in one series.
      required: [soil_organic_index, n_balance, n_balance_kg_ha, n_fixed_share, infiltration_index, runoff_index, pest_pressure_index, bare_weeks, water_demand_mm, irrigation_need_mm]
      properties:
        soil_organic_index: { $ref: '#/components/schemas/YearSeries' }
        n_balance: { $ref: '#/components/schemas/YearSeries' }
        n_balance_kg_ha: { $ref: '#/components/schemas/AbsoluteYearSeries' }
        n_fixed_share: { $ref: '#/components/schemas/YearSeries' }
        infiltration_index: { $ref: '#/components/schemas/YearSeries' }
        runoff_index: { $ref: '#/components/schemas/YearSeries' }
        pest_pressure_index: { $ref: '#/components/schemas/YearSeries' }
        bare_weeks: { $ref: '#/components/schemas/YearSeries' }
        water_demand_mm: { $ref: '#/components/schemas/YearSeries' }
        irrigation_need_mm: { $ref: '#/components/schemas/YearSeries' }
    QuotaStatus:
      type: string
      enum: [within, tight, exceeds, no_quota_given]
    WaterVsQuota:
      type: object
      required: [irrigation_need_p50, irrigation_need_p90, status]
      properties:
        irrigation_need_p50: { $ref: '#/components/schemas/Number' }
        irrigation_need_p90: { $ref: '#/components/schemas/Number' }
        quota_mm_per_season: { type: [number, 'null'] }
        status: { $ref: '#/components/schemas/QuotaStatus' }
    FarmFit:
      type: object
      required: [water_vs_quota, forage_suitability, operational_fit, market_fit]
      properties:
        water_vs_quota: { $ref: '#/components/schemas/WaterVsQuota' }
        forage_suitability: { $ref: '#/components/schemas/Number' }
        operational_fit: { $ref: '#/components/schemas/Number' }
        market_fit:
          oneOf:
            - $ref: '#/components/schemas/Number'
            - type: 'null'
          description: Null when no selected crop has a farmer rating. Unrated crops are review flags.
    StrategyCore:
      type: object
      description: Fields shared by a field strategy and the area-weighted farm rollup.
      required: [id, trajectories, farm_fit, scorecard, estimates]
      properties:
        id: { $ref: '#/components/schemas/RotationId' }
        trajectories: { $ref: '#/components/schemas/Trajectories' }
        farm_fit: { $ref: '#/components/schemas/FarmFit' }
        scorecard:
          type: array
          items: { $ref: '#/components/schemas/RotationScorecard' }
        estimates: { $ref: '#/components/schemas/StrategyEstimates' }
        rotation_explanation: { $ref: '#/components/schemas/RotationExplanation' }
    RotationExplanation:
      type: object
      description: 'v1.3. Rule explanations and crop-role badges. All text comes from the API.'
      required: [rules, crop_roles]
      properties:
        rules:
          type: array
          items:
            type: object
            required: [rule_id, status, text]
            properties:
              rule_id: { type: string, minLength: 1 }
              status: { type: string, enum: [met, broken, unknown] }
              text: { type: string }
        crop_roles:
          type: array
          items:
            type: object
            required: [crop_id, role, text]
            properties:
              crop_id: { $ref: '#/components/schemas/CropId' }
              role: { type: string, enum: [nitrogen_fixing, cover, deep_rooting, drought_tolerant, other] }
              text: { type: string }
    ForecastStrategy:
      allOf:
        - $ref: '#/components/schemas/StrategyCore'
        - type: object
          required: [role, label, cycle_years, plan, vulnerable_seasons, evidence_card, review_flags]
          properties:
            role: { type: string, enum: [existing, alternative, custom] }
            label: { type: string }
            cycle_years: { type: integer, minimum: 1, maximum: 10 }
            plan:
              type: array
              description: Expanded horizon. Index 0 of the parent strategies array is the existing rotation.
              items: { $ref: '#/components/schemas/RotationSlot' }
            vulnerable_seasons:
              type: array
              items: { $ref: '#/components/schemas/ForecastVulnerableSeason' }
            evidence_card:
              allOf:
                - $ref: '#/components/schemas/EvidenceCard'
                - type: object
                  required: [evidence_items]
            review_flags:
              type: array
              items: { $ref: '#/components/schemas/ReviewFlag' }
    ForecastFieldResult:
      type: object
      required: [field_id, name, area_ha, strategies]
      properties:
        field_id: { type: string }
        name: { type: string }
        area_ha: { type: number, exclusiveMinimum: 0 }
        strategies:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ForecastStrategy' }
    FarmRollup:
      type: object
      required: [strategies]
      properties:
        strategies:
          type: array
          description: 'Area-weighted totals keyed by strategy id (rot_existing, rot_alt_1, ...).'
          items: { $ref: '#/components/schemas/StrategyCore' }
    ForecastComparison:
      type: object
      required: [rank_by_priority, rank_stability, deltas_vs_existing_year10]
      properties:
        rank_by_priority:
          type: array
          items: { $ref: '#/components/schemas/RotationId' }
        rank_stability: { type: string }
        deltas_vs_existing_year10:
          type: object
          additionalProperties: { $ref: '#/components/schemas/Number' }
    UncertaintyLayer:
      type: object
      required: [layer, native_resolution_m, record_years, confidence, resolution_note, needs_local_validation]
      properties:
        layer: { type: string }
        native_resolution_m: { type: number, exclusiveMinimum: 0 }
        record_years: { type: string, description: 'Record span as text, for example 1991-2024 or 2015+.' }
        confidence: { $ref: '#/components/schemas/Confidence' }
        resolution_note: { type: string }
        needs_local_validation: { type: boolean }
    StationBias:
      type: object
      required: [variable, bias, n_years]
      properties:
        variable: { type: string }
        bias: { $ref: '#/components/schemas/Number', description: 'POWER minus the local station. Unit is on the number.' }
        n_years: { type: integer, minimum: 0 }
    ForecastUncertainty:
      type: object
      required: [layers, station_bias]
      properties:
        layers:
          type: array
          items: { $ref: '#/components/schemas/UncertaintyLayer' }
        station_bias:
          oneOf:
            - $ref: '#/components/schemas/StationBias'
            - type: 'null'
    ReviewFlag:
      type: object
      required: [id, strategy_id, severity, text, trigger]
      properties:
        id: { type: string }
        strategy_id: { $ref: '#/components/schemas/RotationId' }
        severity: { type: string, enum: [info, caution, verify] }
        text: { type: string }
        trigger:
          type: object
          required: [layer, rule]
          properties:
            layer: { type: string }
            rule: { type: string }
            week: { type: integer, minimum: 0, maximum: 51 }
    Forecast:
      type: object
      required: [site_id, schema_version, pipeline_version, request_hash, horizon_years, scenario, data_mode, disclaimer, support_sentence, climate_outlook, exposure, fields, farm_rollup, comparison, uncertainty, warnings, sources, assumptions]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        schema_version: { type: string, const: "1.2.0" }
        pipeline_version: { type: string }
        request_hash: { type: string, pattern: '^[0-9a-f]{64}$', description: 'Full sha256 hex from app/twin/types.py request_hash.' }
        horizon_years: { type: integer, minimum: 5, maximum: 10 }
        scenario:
          allOf:
            - $ref: '#/components/schemas/ScenarioApplied'
            - type: object
              required: [ramp]
        data_mode: { $ref: '#/components/schemas/DataMode' }
        disclaimer: { type: string }
        support_sentence:
          type: string
          const: This tool supports, and does not replace, local agronomic expertise.
        climate_outlook: { $ref: '#/components/schemas/ClimateOutlook' }
        exposure: { $ref: '#/components/schemas/ForecastExposure' }
        fields:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/ForecastFieldResult' }
        farm_rollup: { $ref: '#/components/schemas/FarmRollup' }
        comparison: { $ref: '#/components/schemas/ForecastComparison' }
        uncertainty: { $ref: '#/components/schemas/ForecastUncertainty' }
        warnings:
          type: array
          items: { $ref: '#/components/schemas/AnalysisWarning' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        assumptions:
          type: array
          description: Unreviewed constants and ramp choices, one plain sentence each.
          items: { type: string }
    SensitivityGrid:
      type: object
      required: [axes, cells, rank_stability]
      properties:
        axes:
          type: object
          required: [rain_scale_pct, temp_offset_c]
          properties:
            rain_scale_pct:
              type: array
              items: { type: number }
            temp_offset_c:
              type: array
              items: { type: number }
        cells:
          type: array
          items:
            type: object
            required: [rain_scale_pct, temp_offset_c, per_strategy]
            properties:
              rain_scale_pct: { type: number }
              temp_offset_c: { type: number }
              per_strategy:
                type: object
                description: Strategy id to Year-10 metrics. Each metric is a Number.
                additionalProperties:
                  type: object
                  additionalProperties: { $ref: '#/components/schemas/Number' }
        rank_stability:
          type: object
          required: [share_first_by_strategy]
          properties:
            share_first_by_strategy:
              type: object
              additionalProperties: { type: number, minimum: 0, maximum: 1 }
    CropCategory:
      type: string
      enum: [vegetable, grain, forage, cover, fruit_perennial]
    ForageUse:
      type: string
      enum: [none, grazing, hay, silage]
    TraitClass:
      type: string
      description: 'low, medium, high. Same words as residue_class. Class boundaries are TODO(verify) with an agronomist.'
      enum: [low, medium, high]
    NFixClass:
      type: string
      description: none means the crop is not treated as fixing nitrogen. Scale is TODO(verify).
      enum: [none, low, medium, high]
    NullableTraitClass:
      description: Null means the class is not verified. Do not replace null with a default.
      oneOf:
        - $ref: '#/components/schemas/TraitClass'
        - type: 'null'
    NullableNFixClass:
      description: Null means the fixation class is not verified.
      oneOf:
        - $ref: '#/components/schemas/NFixClass'
        - type: 'null'
    NullableForageUse:
      description: Null means forage use is not verified.
      oneOf:
        - $ref: '#/components/schemas/ForageUse'
        - type: 'null'
    EquipmentId:
      type: string
      description: 'Catalog equipment id. The published set is CropCatalog.equipment. Pattern only, so W5 can add a sourced id without a contract bump.'
      pattern: '^equip_[a-z0-9_]+$'
    NullableNumber:
      description: 'A measured or assumed number, or null when it is not verified. Do not replace null with a default.'
      oneOf:
        - type: number
        - type: 'null'
    ReferenceYield:
      description: 'Catalog reference yield. Null when no source has been recorded.'
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/Number'
            - type: object
              required: [source]
              properties:
                source: { type: string, description: 'URL or TODO(verify).' }
        - type: 'null'
    CropTraitV2:
      description: Trait schema v2. Extends CropTrait. Null numerics are unverified.
      allOf:
        - $ref: '#/components/schemas/CropTrait'
        - type: object
          required: [category, host_families, return_interval_years, kc_stages, root_depth_m, residue_class, carbon_input_class, n_uptake_class, n_fix_class, frost_tolerance_c, heat_limit_c, drought_tolerance, waterlogging_tolerance, forage_use, reference_yield, yield_response_factor_ky, typical_n_rate_kg_ha, erosion_cover_factor_class, needs_equipment, labour_peak_weeks, region_fit, trait_sources]
          properties:
            category: { $ref: '#/components/schemas/CropCategory' }
            host_families:
              type: array
              items: { type: string }
            return_interval_years: { $ref: '#/components/schemas/NullableNumber' }
            root_depth_m:
              type: object
              description: Metres by stage. Null means not verified.
              required: [ini, mid, end]
              properties:
                ini: { $ref: '#/components/schemas/NullableNumber' }
                mid: { $ref: '#/components/schemas/NullableNumber' }
                end: { $ref: '#/components/schemas/NullableNumber' }
            carbon_input_class: { $ref: '#/components/schemas/NullableTraitClass' }
            n_uptake_class: { $ref: '#/components/schemas/NullableTraitClass' }
            n_fix_class: { $ref: '#/components/schemas/NullableNFixClass' }
            waterlogging_tolerance: { $ref: '#/components/schemas/NullableTraitClass' }
            forage_use: { $ref: '#/components/schemas/NullableForageUse' }
            reference_yield: { $ref: '#/components/schemas/ReferenceYield' }
            yield_response_factor_ky: { $ref: '#/components/schemas/NullableNumber' }
            typical_n_rate_kg_ha: { $ref: '#/components/schemas/NullableNumber' }
            erosion_cover_factor_class: { $ref: '#/components/schemas/NullableTraitClass' }
            needs_equipment:
              type: array
              items: { $ref: '#/components/schemas/EquipmentId' }
            labour_peak_weeks:
              type: array
              description: Week index 0–51.
              items: { type: integer, minimum: 0, maximum: 51 }
            region_fit:
              type: array
              description: 'Climate class strings. Empty means not verified. `oceanic` is the class named for UBC Farm.'
              items: { type: string }
    CatalogEquipment:
      type: object
      required: [id, label, source]
      properties:
        id: { $ref: '#/components/schemas/EquipmentId' }
        label: { type: string }
        source: { type: string, description: 'URL or TODO(verify).' }
    CropCatalog:
      type: object
      required: [crops, equipment]
      properties:
        data_mode: { $ref: '#/components/schemas/DataMode' }
        crops:
          type: array
          items: { $ref: '#/components/schemas/CropTraitV2' }
        equipment:
          type: array
          items: { $ref: '#/components/schemas/CatalogEquipment' }
    ForecastSoilOverride:
      type: object
      required: [sand_pct, silt_pct, clay_pct, organic_carbon_pct]
      properties:
        sand_pct: { type: number }
        silt_pct: { type: number }
        clay_pct: { type: number }
        organic_carbon_pct: { type: number }
    ForecastIrrigation:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        quota_mm_per_season: { type: number, minimum: 0 }
    ForecastSelection:
      type: object
      required: [crops, pinned, excluded]
      properties:
        crops:
          type: array
          minItems: 2
          maxItems: 30
          items: { $ref: '#/components/schemas/CropId' }
        pinned:
          type: array
          items: { $ref: '#/components/schemas/CropId' }
        excluded:
          type: array
          items: { $ref: '#/components/schemas/CropId' }
    ForecastFieldInput:
      type: object
      required: [field_id, name, area_ha, slope_class, irrigation, existing_rotation]
      properties:
        field_id: { type: string, minLength: 1 }
        name: { type: string }
        area_ha: { type: number, exclusiveMinimum: 0 }
        slope_class: { type: string, enum: [flat, gentle, moderate, steep] }
        soil_override: { $ref: '#/components/schemas/ForecastSoilOverride' }
        irrigation: { $ref: '#/components/schemas/ForecastIrrigation' }
        polygon: { $ref: '#/components/schemas/GeoJsonPolygon' }
        existing_rotation:
          oneOf:
            - type: string
              const: preset
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RotationSlot' }
        selection_override: { $ref: '#/components/schemas/ForecastSelection' }
        first_year_planting:
          type: object
          description: |
            Replace exactly one year-one baseline slot in this field for a one-time
            comparison. All other slots and sampled weather are held fixed.
            The response adds rot_first_year_planting. Fields without a replacement
            contribute their unchanged baseline to that strategy's farm rollup.
          required: [season, crop_id]
          properties:
            season: { type: string, enum: [spring, summer, fall, winter] }
            crop_id:
              anyOf:
                - $ref: '#/components/schemas/CropId'
                - const: fallow
    ForecastConstraints:
      type: object
      required: [equipment, max_cycle_years, no_till, labour_level, livestock_on_farm]
      properties:
        equipment:
          type: array
          items: { $ref: '#/components/schemas/EquipmentId' }
        max_cycle_years: { type: integer, minimum: 1, maximum: 10 }
        no_till: { type: boolean }
        labour_level: { type: string, enum: [low, medium, high] }
        livestock_on_farm: { type: boolean }
    CropPrice:
      type: object
      required: [value, unit]
      properties:
        value: { type: number }
        unit: { type: string, description: 'Farmer-entered unit, for example per tonne.' }
    ForecastInputCosts:
      type: object
      properties:
        fertilizer_per_kg_n: { type: number }
        seed_per_ha:
          type: object
          additionalProperties: { type: number }
        irrigation_per_mm_ha: { type: number }
        labour_per_hour: { type: number }
    ForecastEconomics:
      type: object
      required: [currency]
      properties:
        currency: { type: string, minLength: 1 }
        crop_prices:
          type: object
          additionalProperties: { $ref: '#/components/schemas/CropPrice' }
        input_costs: { $ref: '#/components/schemas/ForecastInputCosts' }
    ForecastRequest:
      type: object
      description: |
        climate_source defaults to history_resample until a future-climate dataset is verified
        (decision D2). strategy_count defaults to 3. horizon_years defaults to 10.
        Prices are never filled in by the server.
      required: [selection, constraints, scenario]
      properties:
        fields:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ForecastFieldInput' }
        farm_water_quota_mm_per_season: { type: number, minimum: 0 }
        selection: { $ref: '#/components/schemas/ForecastSelection' }
        custom_strategies:
          type: array
          items:
            type: array
            minItems: 1
            items: { $ref: '#/components/schemas/RotationSlot' }
        strategy_count: { type: integer, minimum: 2, maximum: 4, default: 3 }
        priorities: { $ref: '#/components/schemas/FarmerPriorities' }
        constraints: { $ref: '#/components/schemas/ForecastConstraints' }
        market_ratings:
          type: object
          additionalProperties: { type: integer, minimum: 1, maximum: 5 }
        economics: { $ref: '#/components/schemas/ForecastEconomics' }
        scenario:
          oneOf:
            - $ref: '#/components/schemas/Scenario'
            - $ref: '#/components/schemas/ScenarioInput'
        horizon_years: { type: integer, minimum: 5, maximum: 10, default: 10 }
        climate_source: { type: string, enum: [cmip6_delta, history_resample], default: history_resample }

    # ---------- v1.3.0: outlook, co-pilot, custom field ----------
    OutlookKind:
      type: string
      enum: [climatology, seasonal_forecast]
      description: '`climatology` = typical year from the observed record. `seasonal_forecast` = a real seasonal forecast.'
    OutlookMonth:
      type: object
      required: [month, kind, temperature_mean_c, rain_mm, water_balance_mm, heat_risk, frost_risk]
      properties:
        month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        kind: { $ref: '#/components/schemas/OutlookKind' }
        temperature_mean_c: { $ref: '#/components/schemas/Number' }
        rain_mm: { $ref: '#/components/schemas/Number' }
        water_balance_mm: { $ref: '#/components/schemas/Number' }
        heat_risk: { $ref: '#/components/schemas/Number' }
        frost_risk: { $ref: '#/components/schemas/Number' }
    Outlook:
      type: object
      required: [site_id, start_month, kind, data_mode, months, sources, support_sentence]
      properties:
        site_id: { $ref: '#/components/schemas/SiteId' }
        start_month: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$' }
        kind: { $ref: '#/components/schemas/OutlookKind' }
        data_mode: { $ref: '#/components/schemas/DataMode' }
        months:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/OutlookMonth' }
        sources:
          type: array
          items: { $ref: '#/components/schemas/Source' }
        support_sentence:
          type: string
          const: This tool supports, and does not replace, local agronomic expertise.
    CopilotSelected:
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [field, flag, strategy] }
        id: { type: string, minLength: 1 }
    CopilotSnapshot:
      type: object
      description: Screen state. Holds ids and slider values only, never forecast numbers.
      required: [farm_id, site_id, field_id, horizon, time_index, scenario, strategy_id, selected]
      properties:
        farm_id: { type: string, minLength: 1 }
        site_id: { $ref: '#/components/schemas/SiteId' }
        field_id: { type: [string, 'null'] }
        horizon: { type: string, enum: [years, months] }
        time_index: { type: integer, minimum: 0 }
        scenario: { $ref: '#/components/schemas/ScenarioInput' }
        strategy_id:
          oneOf:
            - $ref: '#/components/schemas/RotationId'
            - type: 'null'
        selected:
          oneOf:
            - $ref: '#/components/schemas/CopilotSelected'
            - type: 'null'
    CopilotMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    CopilotChatRequest:
      type: object
      required: [message, snapshot]
      properties:
        message: { type: string, minLength: 1, maxLength: 1000 }
        snapshot: { $ref: '#/components/schemas/CopilotSnapshot' }
        history:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/CopilotMessage' }
    CopilotChatResponse:
      type: object
      required: [reply, referenced_layers, local_validation_tips]
      properties:
        reply: { type: string }
        referenced_layers:
          type: array
          items: { type: string }
        local_validation_tips:
          type: array
          items: { type: string }
    FieldAnalyzeRequest:
      type: object
      required: [polygon, rotation, scenario]
      properties:
        polygon:
          description: WGS84 `[lon, lat]`, one closed ring, at most 200 ha.
          allOf:
            - $ref: '#/components/schemas/GeoJsonPolygon'
            - type: object
              properties:
                coordinates: { type: array, minItems: 1, maxItems: 1 }
        rotation:
          oneOf:
            - type: string
              const: preset
            - type: array
              minItems: 1
              items: { $ref: '#/components/schemas/RotationSlot' }
        scenario:
          oneOf:
            - $ref: '#/components/schemas/Scenario'
            - $ref: '#/components/schemas/ScenarioInput'
        selection: { $ref: '#/components/schemas/ForecastSelection' }
    FieldAnalyzeResponse:
      type: object
      required: [field_id, area_ha, location, forecast, resolution_notes]
      properties:
        field_id: { type: string, minLength: 1 }
        area_ha: { type: number, exclusiveMinimum: 0, maximum: 200 }
        location:
          type: object
          required: [lat, lon]
          properties:
            lat: { type: number, minimum: -90, maximum: 90 }
            lon: { type: number, minimum: -180, maximum: 180 }
        forecast: { $ref: '#/components/schemas/Forecast' }
        resolution_notes:
          type: array
          items: { type: string }

    # ---------- Errors ----------
    ErrorCode:
      type: string
      description: |
        HTTP status mapping: INVALID_INPUT 422, UNSUPPORTED_FILE 415, FILE_TOO_LARGE 413,
        TERRAIN_COVERAGE_MISSING 422, DATA_SOURCE_UNAVAILABLE 503, WEATHER_UNAVAILABLE 503,
        SIMULATION_TIMEOUT 504, NOT_FOUND 404, INTERNAL 500,
        SITE_NOT_FOUND 404, UNKNOWN_CROP 422, INVALID_WEIGHTS 422, NO_FEASIBLE_ALTERNATIVES 422,
        SCENARIO_OUT_OF_RANGE 422 (v1.1),
        SELECTION_TOO_SMALL 422, INVALID_QUOTA 422, HORIZON_OUT_OF_RANGE 422 (v1.2),
        RATE_LIMITED 429, retryable true (v1.3).
      enum:
        - INVALID_INPUT
        - UNSUPPORTED_FILE
        - FILE_TOO_LARGE
        - TERRAIN_COVERAGE_MISSING
        - DATA_SOURCE_UNAVAILABLE
        - WEATHER_UNAVAILABLE
        - SIMULATION_TIMEOUT
        - NOT_FOUND
        - INTERNAL
        - SITE_NOT_FOUND
        - UNKNOWN_CROP
        - INVALID_WEIGHTS
        - NO_FEASIBLE_ALTERNATIVES
        - SCENARIO_OUT_OF_RANGE
        - SELECTION_TOO_SMALL
        - INVALID_QUOTA
        - HORIZON_OUT_OF_RANGE
        - RATE_LIMITED
    ErrorBody:
      type: object
      required: [code, message, retryable]
      properties:
        code: { $ref: '#/components/schemas/ErrorCode' }
        message: { type: string }
        hint: { type: string }
        retryable: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/ErrorBody' }
